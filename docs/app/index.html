<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#04070a" />
    <!-- iOS: «На экран “Домой”» из Safari открывает дашборд как отдельное
         полноэкранное приложение (Safari не требует HTTPS, в отличие от Android) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Weathered_Kiwi" />
    
    
    <title>Weathered_Kiwi</title>
    <!-- Заглушка на случай, когда сам дашборд не запустился. Раньше в этом
         случае оставался чёрный экран без единого слова: сообщать о беде
         было некому, потому что сообщать умеет только тот самый код, который
         и не выполнился.

         Показывается через 10 секунд и только средствами CSS — заголовки
         безопасности запрещают встроенные скрипты, так что таймера на
         JavaScript здесь быть не может. React при запуске очищает контейнер,
         и заглушка исчезает сама, ничего для этого не делая. -->
    <style>
      #boot {
        opacity: 0; animation: bootshow 0s 10s forwards;
        max-width: 30rem; margin: 15vh auto 0; padding: 0 1.5rem;
        color: #7b8794; font: 13px/1.7 ui-monospace, Consolas, monospace;
      }
      #boot b { display: block; margin-bottom: .9rem; color: #e7eef6;
                font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
      #boot a { display: inline-block; margin-top: 1.1rem; padding: .5rem .9rem;
                border: 1px solid #263140; color: #e7eef6; text-decoration: none; }
      @keyframes bootshow { to { opacity: 1 } }
    </style>
    
    <style>:root{--lightningcss-light: ;--lightningcss-dark:initial;color-scheme:dark;color:#e7eef6;font-synthesis:none;text-rendering:optimizelegibility;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;background:#04070a}html,body{background:#04070a;min-height:100%;margin:0;padding:0}#root{background:#04070a;min-height:100svh}*{box-sizing:border-box}
</style>
  <link rel="manifest" href="manifest.webmanifest" /><link rel="apple-touch-icon" href="apple-touch-icon.png" /><link rel="icon" href="../icon.png" /></head>
  <body>
    <div id="root">
      <div id="boot">
        <b>Дашборд не запустился</b>
        Страница пришла, но её код не выполнился. Чаще всего браузер держит в
        памяти прошлую версию и просит файл, которого на плате уже нет.
        <br /><br />
        Лечится обновлением с очисткой: <b style="display:inline;text-transform:none;letter-spacing:0">Ctrl+F5</b>
        на компьютере, а на телефоне — очистить данные сайта в настройках браузера.
        <a href="/">Открыть заново</a>
      </div>
    </div>

  .sw { display: inline-flex; align-items: center; background: none;
        border: 0; padding: 2px; cursor: pointer; flex-shrink: 0 }
  .sw-track {
    position: relative; display: block; box-sizing: border-box;
    width: var(--sw-w, 46px); height: var(--sw-h, 24px); border-radius: 999px;
    border: 1px solid var(--pnl-line, rgba(160,180,200,0.30));
    background: rgba(255,255,255,0.045);
    transition: border-color .5s var(--ease-out), background-color .5s var(--ease-out);
  }
  /* Заливка растёт из-под шарика, а не проявляется целиком: так видно, в какую
     сторону переключили, — и это ровно то, чего не умеет пара кнопок. */
  .sw-track::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    background: var(--sw-accent, #67e8f9); opacity: 0;
    transform: scale(.25); transform-origin: 18% 50%;
    transition: transform .55s var(--ease-back), opacity .45s var(--ease-out);
  }
  .sw.on .sw-track::before { opacity: .26; transform: scale(1) }
  .sw.on .sw-track { border-color: var(--sw-accent, #67e8f9) }
  .sw-knob {
    position: absolute; top: 50%; left: 2px;
    width: var(--sw-k, 18px); height: var(--sw-k, 18px);
    margin-top: calc(var(--sw-k, 18px) / -2);
    border-radius: 999px; background: rgba(231,238,246,0.60);
    box-shadow: 0 1px 5px rgba(0,0,0,0.55);
    transition: transform .55s var(--ease-back), width .3s var(--ease-out),
                background-color .45s var(--ease-out);
  }
  .sw.on .sw-knob {
    background: #e7eef6;
    transform: translateX(calc(var(--sw-w, 46px) - var(--sw-k, 18px) - 4px));
  }
  /* Под пальцем шарик растягивается и отпускает обратно — так ведёт себя
     настоящий тумблер, и без этого нажатие ощущается как промах. */
  .sw:active .sw-knob { width: calc(var(--sw-k, 18px) + 5px) }
  /* Кольцо расходится в момент переключения. Живёт ровно один проигрыш: узел
     появляется по счётчику нажатий, новый ключ перезапускает анимацию. */
  @keyframes swRing { from { opacity: .5; transform: scale(1) }
                      to   { opacity: 0;  transform: scale(1.85) } }
  .sw-ring { position: absolute; inset: -1px; border-radius: 999px; pointer-events: none;
             border: 1px solid var(--sw-accent, #67e8f9);
             animation: swRing .75s var(--ease-out) forwards }
  .sw-mini { --sw-w: 32px; --sw-h: 17px; --sw-k: 12px }
  .sw-side { font-family: ${k}; font-size: 10.5px; letter-spacing: .6px;
             cursor: pointer; user-select: none; white-space: nowrap;
             transition: color .45s var(--ease-out), transform .45s var(--ease-back) }
  .sw-side.lit { color: #e7eef6; transform: translateY(-1px) }
  .sw-side:not(.lit) { color: rgba(231,238,246,0.30); transform: translateY(1px) }
  .mo-off .sw-track, .mo-off .sw-track::before,
  .mo-off .sw-knob, .mo-off .sw-side { transition: none }

      /* Угол света на фаске — ненаследуемый: дашборд пишет его на сами блоки
         (наклон телефона), и смена не расходится по всему содержимому. */
      @property --lg-a  { syntax: "<angle>";  inherits: false; initial-value: 135deg }

      .th-liquid {

           выводится всё остальное: чем стекло «сильнее», тем оно прозрачнее,
           тем меньше инея и ярче фаска. */
        --lg-k: .72;
        --lg-tint-a: calc(0.30 - var(--lg-k) * 0.16);
        --lg-blur-r: calc(20px - var(--lg-k) * 11px);
        --lg-sat: calc(1.35 + var(--lg-k) * 0.55);
        --lg-spec: calc(0.55 + var(--lg-k) * 0.45);

        /* Снаружи: кайма iOS 27, близкая тень, далёкая тень. Внутри: кромка
           сверху, отражение снизу, свечение толщи стекла у края. */

                      0 2px 6px -1px rgba(0,0,0,0.30),
                      0 22px 54px -20px rgba(0,0,0,0.70),
                      inset 0 1px 0.5px rgba(255,255,255,0.42),
                      inset 0 -1px 0.5px rgba(255,255,255,0.10),
                      inset 0 0 18px rgba(255,255,255,0.05);
        --pnl-corner: calc(var(--ui-corner, 0px) + 14px);
        /* Над живым фоном размытие почти ничего не меняет — фон и так мягкий,

        --pnl-blur: blur(calc(var(--lg-blur-r) * 0.5)) saturate(var(--lg-sat));
        /* Плитки сводки: та же тонировка, плюс линия-акцент снизу — она

                   linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04)),
                   rgba(8,12,22,calc(var(--lg-tint-a) - 0.02));
        --stat-shadow: 0 0 0 0.5px rgba(0,0,0,0.38), 0 14px 30px -16px rgba(0,0,0,0.7),

                       inset 0 -1px 0.5px rgba(255,255,255,0.08);
        /* Плавающее стекло (док, кнопки, всплывашки): тоньше и прозрачнее

        --fl-shadow: 0 0 0 0.5px rgba(0,0,0,0.48), 0 2px 6px -2px rgba(0,0,0,0.40),

      .th-liquid .tutor-box {

.sys-hero { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px }
.sys-big { font-family: var(--ui-mono); font-variant-numeric: tabular-nums; font-size: 46px; font-weight: 700; line-height: 1;
  letter-spacing: -1px; text-shadow: 0 0 18px currentColor }
.sys-big small { font-size: 15px; font-weight: 500; letter-spacing: 1px; margin-left: 5px; opacity: .6; text-shadow: none }
.sys-big-sm { font-size: 38px }
.sys-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px;
  font-family: var(--ui-mono); font-size: 11px; color: rgba(231,238,246,0.75) }
.sys-chip { font-family: var(--ui-mono); font-size: 9.5px; letter-spacing: .8px; padding: 3px 9px; border-radius: 999px; white-space: nowrap;
  border: 1px solid rgba(231,238,246,0.25); background: rgba(255,255,255,0.07); color: rgba(231,238,246,0.85) }
.sys-bad { color: #ff7b7b; border-color: rgba(255,123,123,0.5); background: rgba(255,90,90,0.12) }

.sys-bat { position: relative; height: 14px; margin-top: 14px; border-radius: 999px; overflow: hidden;
  background: rgba(255,255,255,0.09); box-shadow: inset 0 1px 3px rgba(0,0,0,0.5) }
.sys-bat i { display: block; height: 100%; border-radius: inherit; position: relative;
  background: linear-gradient(90deg, color-mix(in srgb, var(--bc) 70%, #000), var(--bc));
  box-shadow: 0 0 14px var(--bc); transition: width 1s var(--ease-back), background .6s }
.sys-bat i.chg::after { content: ""; position: absolute; inset: 0;
  background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,0.55) 50%, transparent 70%);
  background-size: 220% 100%; animation: sysCharge 1.8s linear infinite }
@keyframes sysCharge { from { background-position: 160% 0 } to { background-position: -60% 0 } }

.sys-sig { display: flex; align-items: flex-end; gap: 16px }
.sys-bars { display: flex; align-items: flex-end; gap: 5px; height: 46px }
.sys-bars i { width: 11px; border-radius: 4px; background: rgba(255,255,255,0.14); transition: background .4s, box-shadow .4s }
.sys-bars i.on { background: linear-gradient(180deg, #a5f3fc, #38bdf8); box-shadow: 0 0 12px rgba(56,189,248,0.7) }

.sys-live { display: flex; align-items: center; gap: 16px }
.sys-dot { width: 22px; height: 22px; border-radius: 50%; flex: none; position: relative }
.sys-dot.ok { background: #4ade80; box-shadow: 0 0 18px #4ade80 }
.sys-dot.mid { background: #facc15; box-shadow: 0 0 16px #facc15 }
.sys-dot.bad { background: #ff5d5d; box-shadow: 0 0 16px #ff5d5d }
.sys-dot.ok::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid #4ade80;
  animation: sysPing 1.6s ease-out infinite }
@keyframes sysPing { from { transform: scale(1); opacity: .9 } to { transform: scale(2.4); opacity: 0 } }

.led-auto { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-family: var(--ui-sans); font-size: 10px;
  letter-spacing: 1.5px; padding: 5px 12px 5px 8px; border-radius: 999px; color: #e7eef6;
  border: 1px solid rgba(231,238,246,0.3); background: rgba(255,255,255,0.07) }
.led-auto.flash { animation: ledFlash .9s ease }
@keyframes ledFlash { 0%,100% { box-shadow: none } 25%,75% { box-shadow: 0 0 0 4px rgba(255,154,60,0.7), 0 0 22px rgba(255,154,60,0.6) } }

.led-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px }
@media (max-width: 760px) { .led-grid { grid-template-columns: repeat(2, 1fr) } }
.led-card { position: relative; min-height: 210px; padding: 16px 12px 14px; border-radius: 30px; box-sizing: border-box;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: none; -webkit-tap-highlight-color: transparent;
  border: 1px solid rgba(255,255,255,0.16);
  background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.03));
  box-shadow: inset 0 1px .5px rgba(255,255,255,0.35), 0 14px 30px -18px rgba(0,0,0,0.7);
  transform: translate(var(--dx, 0px), var(--dy, 0px));
  transition: transform .5s var(--ease-back), box-shadow .45s ease, background .45s ease, border-color .45s ease, opacity .3s }
.led-card.drag { transition: box-shadow .45s ease, background .45s ease }
.led-card:focus-visible { outline: 2px solid rgba(231,238,246,0.7); outline-offset: 3px }
.led-card:active:not(.drag) { transform: scale(.97) }
.led-card.dis { opacity: .6 }
.led-card.lit { border-color: color-mix(in srgb, var(--c) 55%, transparent);
  background: linear-gradient(180deg, color-mix(in srgb, var(--c) 24%, transparent), rgba(255,255,255,0.04));
  box-shadow: inset 0 1px .5px rgba(255,255,255,0.4), 0 0 44px -8px color-mix(in srgb, var(--c) 65%, transparent), 0 14px 30px -18px rgba(0,0,0,0.7) }

.led-orb { width: 78px; height: 78px; border-radius: 50%; margin-bottom: 8px; pointer-events: none;
  animation: ledPop .6s var(--ease-back) both;
  background: radial-gradient(circle at 35% 28%, rgba(255,255,255,0.32), rgba(255,255,255,0.04) 55%, transparent 72%),
              color-mix(in srgb, var(--c) 16%, #1b2232);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14), inset 0 -10px 16px rgba(0,0,0,0.35);
  transition: background .45s ease, box-shadow .45s ease }
.led-card.lit .led-orb {
  background: radial-gradient(circle at 35% 28%, #fff 0%, color-mix(in srgb, var(--c) 80%, #fff) 26%, var(--c) 62%, color-mix(in srgb, var(--c) 55%, #000) 100%);
  box-shadow: 0 0 28px 4px color-mix(in srgb, var(--c) 75%, transparent), 0 0 80px 12px color-mix(in srgb, var(--c) 40%, transparent),
              inset 0 -10px 16px rgba(0,0,0,0.25) }
.led-card.blink .led-orb { animation: ledPop .6s var(--ease-back) both, ledPulse 1s ease-in-out .6s infinite }
@keyframes ledPulse { 0%,100% { filter: brightness(1) } 50% { filter: brightness(.3) saturate(.6) } }
@keyframes ledPop {
  from { opacity: 0; transform: translateY(calc(var(--pdy, 0) * 40px)) scale(.5) }
  60% { opacity: 1; transform: translateY(calc(var(--pdy, 0) * -5px)) scale(1.1) }
  to { opacity: 1; transform: none }
}
.led-name { font-family: var(--ui-sans); font-size: 13px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; color: #e7eef6;
  text-shadow: 0 0 12px color-mix(in srgb, var(--c) 60%, transparent) }
.led-fn { font-family: var(--ui-sans); font-size: 9.5px; letter-spacing: 1.4px; text-transform: uppercase; color: rgba(231,238,246,0.5) }
.led-mode { font-family: var(--ui-mono); font-size: 10.5px; margin-top: 6px; color: rgba(231,238,246,0.8) }
.led-card:not(.lit) .led-mode { color: rgba(231,238,246,0.4) }
.led-pips { display: flex; align-items: center; gap: 7px; margin-top: 8px; color: rgba(231,238,246,0.35); font-size: 15px; line-height: 1 }
.led-pips i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.2); transition: all .35s var(--ease-back) }
.led-pips i.on { width: 18px; border-radius: 999px; background: var(--c); box-shadow: 0 0 10px var(--c) }
.led-dots { position: absolute; right: 11px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 6px }
.led-dots i { width: 5px; height: 5px; border-radius: 50%; background: color-mix(in srgb, var(--dc) 45%, rgba(255,255,255,0.1)); opacity: .55;
  transition: all .35s var(--ease-back) }
.led-dots i.on { height: 16px; border-radius: 999px; opacity: 1; background: var(--dc); box-shadow: 0 0 10px var(--dc) }
.led-help { margin-top: 14px; font-family: var(--ui-sans); font-size: 10.5px; line-height: 1.55; color: rgba(231,238,246,0.5) }

.ar-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px }
.ar-chip { font-family: var(--ui-mono); font-size: 9.5px; letter-spacing: .6px; padding: 3px 9px; border-radius: 999px; white-space: nowrap;
  border: 1px solid rgba(231,238,246,0.25); background: rgba(255,255,255,0.07); color: rgba(231,238,246,0.85) }
.ar-pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px }
.ar-sub { font-family: var(--ui-sans); font-size: 11.5px; color: rgba(231,238,246,0.6); margin-top: 4px; line-height: 1.5 }
.ar-where { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap }
.ar-place { font-family: var(--ui-sans); font-size: 22px; font-weight: 700; color: #e7eef6; text-shadow: 0 0 16px rgba(160,205,255,0.4) }
.ar-actions { display: flex; gap: 10px; flex-wrap: wrap }
.ar-btn { display: inline-flex; align-items: center; justify-content: center; cursor: pointer; font-family: var(--ui-sans); font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: #e7eef6;
  padding: 11px 18px; border-radius: 999px; border: 1px solid rgba(231,238,246,0.3);
  background: linear-gradient(180deg, rgba(255,255,255,0.16), rgba(255,255,255,0.05)); box-shadow: inset 0 1px .5px rgba(255,255,255,0.4);
  transition: transform .4s var(--ease-back), background .3s }
.ar-btn:hover:not(:disabled) { transform: translateY(-2px) scale(1.03) }
.ar-btn:disabled { opacity: .55 }
.ar-btn.big { padding: 14px 24px; font-weight: 700; border-color: rgba(125,211,252,0.7); box-shadow: inset 0 1px .5px rgba(255,255,255,0.5), 0 0 24px -6px rgba(125,211,252,0.6) }
.ar-btn.on { border-color: rgba(139,226,139,0.7); box-shadow: 0 0 20px -6px rgba(139,226,139,0.7) }
.ar-search { margin-top: 14px; display: flex; flex-direction: column; gap: 8px }
.ar-search input { flex: 1; min-width: 0; padding: 11px 16px; border-radius: 999px; font-size: 13px; font-family: var(--ui-sans); color: #e7eef6;
  background: rgba(0,0,0,0.25); border: 1px solid rgba(231,238,246,0.25); outline: none }
.ar-search input:focus { border-color: rgba(125,211,252,0.8) }
.ar-res { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; cursor: pointer; padding: 10px 14px; border-radius: 16px;
  background: rgba(255,255,255,0.06); border: 1px solid rgba(231,238,246,0.15); color: #e7eef6; font-family: var(--ui-sans); font-size: 13px }
.ar-res span { font-size: 10.5px; color: rgba(231,238,246,0.55) }
.ar-err { margin-top: 12px; padding: 9px 12px; border-left: 2px solid #fb923c; color: #fdba74; font-size: 11.5px; line-height: 1.55; font-family: var(--ui-sans) }

.ar-now { display: flex; align-items: center; gap: 16px }
.ar-emoji { font-size: 54px; line-height: 1; filter: drop-shadow(0 0 16px rgba(160,205,255,0.5)) }
.ar-temp { font-family: var(--ui-mono); font-size: 52px; font-weight: 700; line-height: 1; color: #e7eef6; text-shadow: 0 0 18px rgba(160,205,255,0.5) }
.ar-temp small { font-size: 18px; font-weight: 500; margin-left: 3px; opacity: .6 }
.ar-facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; margin-top: 14px }
.ar-facts div { display: flex; flex-direction: column; gap: 2px }
.ar-facts span { font-family: var(--ui-sans); font-size: 9.5px; letter-spacing: 1.4px; text-transform: uppercase; color: rgba(231,238,246,0.45) }
.ar-facts b { font-family: var(--ui-mono); font-size: 13px; font-weight: 600; color: #e7eef6 }

.ar-nowcast { font-family: var(--ui-sans); font-size: 13.5px; font-weight: 600; color: #e7eef6; margin-bottom: 12px; line-height: 1.45;
  text-shadow: 0 0 12px rgba(160,205,255,0.35) }
.ar-strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin }
.ar-hour { flex: none; width: 52px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px; border-radius: 18px;
  background: rgba(255,255,255,0.06); border: 1px solid rgba(231,238,246,0.12); font-family: var(--ui-mono) }
.ar-h { font-size: 10.5px; color: rgba(231,238,246,0.6) }
.ar-e { font-size: 20px; line-height: 1 }
.ar-hour b { font-size: 13px; color: #e7eef6 }
.ar-p { font-size: 10px; color: #7dd3fc; min-height: 12px }
.ar-w { font-size: 10px; color: rgba(231,238,246,0.55) }
.ar-legend { font-family: var(--ui-sans); font-size: 10px; line-height: 1.6; color: rgba(231,238,246,0.38) }
.ar-ok { font-family: var(--ui-sans); font-size: 13px; color: #8be28b; text-shadow: 0 0 10px rgba(120,230,120,0.35); line-height: 1.5 }
.ar-alert { font-family: var(--ui-sans); font-size: 13px; line-height: 1.5; padding: 6px 0; color: #fcd34d }
.ar-alert.bad { color: #ff8585; font-weight: 600 }
.ar-sens { display: flex; align-items: baseline; gap: 10px; padding: 5px 0; border-bottom: 1px solid rgba(231,238,246,0.1); font-size: 11px }
.ar-sens span { font-family: var(--ui-mono); color: #7dd3fc; white-space: nowrap }
.ar-sens em { flex: 1; min-width: 0; font-style: normal; color: rgba(231,238,246,0.6); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--ui-sans) }
.ar-sens b { font-family: var(--ui-mono); font-weight: 600; white-space: nowrap }

.ar-compass-wrap { position: relative; display: grid; place-items: center }
.ar-compass { width: min(300px, 82vw); height: auto; overflow: visible }
.ar-rose, .ar-wind { transition: transform .12s linear }
.ar-face { position: absolute; bottom: 4px; padding: 4px 12px; border-radius: 999px; font-family: var(--ui-sans); font-size: 11px; letter-spacing: 1.5px;
  text-transform: uppercase; color: #8be28b; border: 1px solid rgba(139,226,139,0.6); background: rgba(40,90,40,0.35); animation: arFace .4s var(--ease-back) both }
@keyframes arFace { from { opacity: 0; transform: scale(.6) } to { opacity: 1; transform: none } }
.ar-wind-line { text-align: center; margin: 12px 0 14px; font-family: var(--ui-sans); font-size: 13px; line-height: 1.55; color: rgba(231,238,246,0.85) }
.ar-wind-line b { font-family: var(--ui-mono); color: #e7eef6 }
.ar-compass-ctl { display: flex; flex-direction: column; align-items: center; gap: 10px }
.ar-note { font-family: var(--ui-sans); font-size: 11px; line-height: 1.55; text-align: center; color: rgba(231,238,246,0.5); max-width: 340px }
.ar-mode { display: flex; flex-direction: column; gap: 14px }
.ar-switch { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 14px }
.ar-seg { position: relative; display: grid; grid-template-columns: 1fr 1fr; width: 220px; padding: 4px; border-radius: 999px;
  border: 1px solid rgba(231,238,246,0.22); background: rgba(255,255,255,0.06) }
.ar-seg button { position: relative; z-index: 1; padding: 9px 0; border: 0; background: none; cursor: pointer; border-radius: 999px;
  font-family: var(--ui-sans); font-size: 11px; font-weight: 600; letter-spacing: 1.6px; text-transform: uppercase; color: rgba(231,238,246,0.55); transition: color .3s }
.ar-seg button.on { color: #fff }
.ar-seg i { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); border-radius: 999px;
  background: linear-gradient(180deg, rgba(125,211,252,0.35), rgba(167,139,250,0.28)); box-shadow: inset 0 1px .5px rgba(255,255,255,0.45), 0 0 18px -4px rgba(125,211,252,0.6);
  transition: transform .55s var(--ease-back) }
.ar-switch-note { font-family: var(--ui-sans); font-size: 11.5px; color: rgba(231,238,246,0.6); min-width: 0 }
.ar-switch-note b { color: #e7eef6; font-weight: 600 }
.ar-gauge { position: relative; width: 168px; height: 168px; margin: 4px auto 6px }

.ar-gauge-in { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center }
.ar-gauge-in b { font-family: var(--ui-mono); font-size: 40px; font-weight: 700; line-height: 1; text-shadow: 0 0 18px currentColor }
.ar-gauge-in span { font-family: var(--ui-sans); font-size: 10px; letter-spacing: 2px; color: rgba(231,238,246,0.5); margin-top: 3px }
.ar-bft { text-align: center; font-family: var(--ui-sans); font-size: 13px; color: rgba(231,238,246,0.85) }
.ar-bft b { font-family: var(--ui-mono); font-size: 15px; color: #e7eef6 }
.ar-bars { display: flex; align-items: flex-end; gap: 5px; flex: 1 0 64px; min-height: 64px; margin-top: 14px }
.ar-bar { position: relative; flex: 1; height: 100%; display: flex; align-items: flex-end }
.ar-bar i { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 4px 4px 2px 2px }
/* Ячейка столбика видна всегда: двенадцать мест читаются шкалой, даже пока данных нет. */
.ar-bar::before { content: ""; position: absolute; inset: 0; border-radius: 4px 4px 2px 2px; background: rgba(255,255,255,0.035) }
.ar-bar .gu { background: rgba(255,255,255,0.14) }
.ar-bar .sp { left: 18%; right: 18% }
.ar-steps { display: flex; flex-direction: column; gap: 10px }
.ar-steps div { display: flex; align-items: center; gap: 14px; font-family: var(--ui-sans); font-size: 12.5px; line-height: 1.5; color: rgba(231,238,246,0.8) }

.mo-off .ar-rose, .mo-off .ar-wind, .mo-off .ar-face { transition: none; animation: none }

.gs-track.gs-drag .gs-thumb { cursor: grabbing }

8 -5,-10 -14,-1 -15,9 -20,0 -9,5 -7,10 -17,12 -5,7 -2,9 -14,9 4,7 -7,4 10,12 15,3 4,4 2,8 -11,-3 -6,-2 -9,-1 -12,3 -1,7 4,5 10,0 20,-2 -17,6 -9,3 -10,-1 -8,3 11,9 -6,4 -8,7 -12,10 -13,4 0,4 -27,6 -21,1 -27,-1 -24,0 -12,3 -17,6 26,3 20,1 -42,2 -23,4 1,4 38,5 37,5 4,4 -27,3 9,4 34,7 15,1 -4,5 23,2 31,2 31,0 11,-3 26,5 24,-3 14,-1 21,-3 -24,5 1,4 34,6 35,0 13,3 35,1 80,-1`}));function ji(e){return Mi[Math.max(0,Math.min(5,e??0))]}var Mi,V,H,Ni=t((()=>{Mi=[{ef:0,key:`EF0`,color:`#e7eef6`,ring:`#e7eef6`,wind:`105–137 км/ч`,dmg:`Лёгкие повреждения: ветки, водостоки, дымоходы`},{ef:1,key:`EF1`,color:`#34d399`,ring:`#34d399`,wind:`138–178 км/ч`,dmg:`Сорвана кровля, сдвинуты автоприцепы`},{ef:2,key:`EF2`,color:`#facc15`,ring:`#facc15`,wind:`179–218 км/ч`,dmg:`Снесены крыши, вырваны крупные деревья`},{ef:3,key:`EF3`,color:`#f97316`,ring:`#fb923c`,wind:`219–266 км/ч`,dmg:`Разрушены этажи капитальных домов, опрокинуты поезда`},{ef:4,key:`EF4`,color:`#b91c1c`,ring:`#ef4444`,wind:`267–322 км/ч`,dmg:`Каркасные дома сметены полностью, машины переброшены`},{ef:5,key:`EF5`,color:`#6b0f1a`,ring:`#ff2d2d`,wind:`свыше 322 км/ч`,dmg:`Капитальные дома срываются с фундамента, местность выскабливается`}],V=[{id:`tri-state-1925`,ef:5,scale:`F5`,name:`Трёхштатный смерч`,place:`Миссури — Иллинойс — Индиана, США`,lat:37.9,lon:-89,date:`1925-03-18`,deaths:695,injured:2027,pathKm:352,widthM:1600,windKmh:null,note:`Самый смертоносный смерч в истории США и самый длинный по непрерывному пути. Шёл около трёх с половиной часов; предупреждений о смерчах в 1925 году не существовало — само слово было под неофициальным запретом в сводках, чтобы не сеять панику.`},{id:`bridge-creek-1999`,ef:5,scale:`F5`,name:`Бридж-Крик — Мур`,place:`Оклахома, США`,lat:35.34,lon:-97.49,date:`1999-05-03`,deaths:36,injured:583,pathKm:61,widthM:1600,windKmh:484,note:`В этом смерче мобильный доплеровский радар DOW измерил 484 км/ч (301 миля/ч) — самая высокая скорость ветра, когда-либо зарегистрированная у поверхности Земли. Измерение сделано на высоте около 30 м, поэтому в рейтинг оно не вошло: категорию определяют по разрушениям, а не по радару.`},{id:`jarrell-1997`,ef:5,scale:`F5`,name:`Джаррелл`,place:`Техас, США`,lat:30.82,lon:-97.6,date:`1997-05-27`,deaths:27,injured:12,pathKm:12,widthM:1200,windKmh:null,note:`Двигался необычно медленно — около 8 км/ч, — поэтому стоял над каждым участком дольше обычного. Асфальт был содран с дорог, грунт выскоблен на глубину до полуметра.`},{id:`joplin-2011`,ef:5,scale:`EF5`,name:`Джоплин`,place:`Миссури, США`,lat:37.08,lon:-94.51,date:`2011-05-22`,deaths:158,injured:1150,pathKm:22.1,widthM:1600,windKmh:320,note:`Самый смертоносный смерч США с начала официальной статистики в 1950 году. Прошёл через город в воскресенье вечером; предупреждение было выпущено за 24 минуты.`},{id:`moore-2013`,ef:5,scale:`EF5`,name:`Мур`,place:`Оклахома, США`,lat:35.34,lon:-97.49,date:`2013-05-20`,deaths:24,injured:212,pathKm:22.9,widthM:1900,windKmh:338,note:`Прошёл почти по следу смерча 1999 года. Погибли семеро детей в начальной школе — после этого в Оклахоме пересматривали требования к убежищам в школах.`},{id:`el-reno-2013`,ef:3,scale:`EF3`,name:`Эль-Рино`,place:`Оклахома, США`,lat:35.53,lon:-97.96,date:`2013-05-31`,deaths:8,injured:151,pathKm:26,widthM:4200,windKmh:476,note:`Самый широкий смерч за всю историю наблюдений — 4.2 км. Рейтинг всего EF3, потому что основная воронка прошла по малозастроенной местности, а категорию дают по разрушениям. Погибли исследователи Тим Самарас, Пол Самарас и Карл Янг — первый случай гибели научной группы внутри смерча.`},{id:`tuscaloosa-2011`,ef:4,scale:`EF4`,name:`Таскалуса — Бирмингем`,place:`Алабама, США`,lat:33.21,lon:-87.57,date:`2011-04-27`,deaths:64,injured:1500,pathKm:130.7,widthM:2400,windKmh:306,note:`Часть Супервспышки 27 апреля 2011 года — крупнейшей вспышки смерчей в истории наблюдений: за сутки подтверждено более 350 смерчей.`},{id:`mayfield-2021`,ef:4,scale:`EF4`,name:`Западный Кентукки`,place:`Кентукки, США`,lat:36.74,lon:-88.64,date:`2021-12-10`,deaths:57,injured:null,pathKm:265,widthM:1300,windKmh:306,note:`Декабрьский смерч — время года, для смерчей нехарактерное. Прошёл 265 км, разрушив центр города Мэйфилд. Один из самых длинных путей за современную историю.`},{id:`rolling-fork-2023`,ef:4,scale:`EF4`,name:`Роллинг-Форк`,place:`Миссисипи, США`,lat:32.91,lon:-90.88,date:`2023-03-24`,deaths:17,injured:null,pathKm:95,widthM:1200,windKmh:314,note:`Ночной смерч в бедном сельском районе. Ночные смерчи вдвое смертоноснее дневных: их не видно, и предупреждение застаёт людей спящими.`},{id:`greenfield-2024`,ef:4,scale:`EF4`,name:`Гринфилд`,place:`Айова, США`,lat:41.3,lon:-94.46,date:`2024-05-21`,deaths:5,injured:35,pathKm:71,windKmh:498,widthM:800,note:`Мобильный радар зафиксировал внутри воронки 498–512 км/ч — одно из самых высоких измерений за всю историю. В рейтинг это снова не вошло: измерение сделано выше уровня разрушений, а категорию присваивают по обследованию на земле.`},{id:`natchez-1840`,ef:null,scale:`не оценён`,name:`Натчез`,place:`Миссисипи, США`,lat:31.56,lon:-91.4,date:`1840-05-07`,deaths:317,injured:109,pathKm:null,widthM:null,windKmh:null,note:`Второй по числу жертв смерч в истории США. Прошёл вдоль реки Миссисипи и потопил стоявшие у берега суда. Настоящее число погибших почти наверняка больше: в тогдашней статистике не считали рабов, а именно они работали на реке и на плантациях. Рейтинга нет — шкала Фудзиты появилась только через сто тридцать лет.`},{id:`stlouis-1896`,ef:null,scale:`не оценён`,name:`Сент-Луис — Восточный Сент-Луис`,place:`Миссури — Иллинойс, США`,lat:38.63,lon:-90.2,date:`1896-05-27`,deaths:255,injured:1e3,pathKm:16,widthM:null,windKmh:null,note:`Третий по числу жертв смерч США и первый, разрушивший крупный город. Снёс часть моста Идс, доски пробивали стальные балки насквозь. После него в Сент-Луисе впервые всерьёз занялись городской службой погоды.`},{id:`tupelo-1936`,ef:5,scale:`F5`,name:`Тьюпело`,place:`Миссисипи, США`,lat:34.26,lon:-88.7,date:`1936-04-05`,deaths:216,injured:700,pathKm:null,widthM:600,windKmh:null,note:`Четвёртый по числу жертв в истории США. Среди выживших — годовалый Элвис Пресли с матерью. Как и в Натчезе, погибших среди чернокожего населения считали отдельно и неполно, поэтому настоящая цифра выше официальной.`},{id:`gainesville-1936`,ef:4,scale:`F4`,name:`Гейнсвилл`,place:`Джорджия, США`,lat:34.3,lon:-83.82,date:`1936-04-06`,deaths:203,injured:1600,pathKm:null,widthM:null,windKmh:null,note:`Пятый по числу жертв в США — и следующий день той же вспышки, что накрыла Тьюпело. Ударил в 8:30 утра, когда рабочие уже были на фабриках: большинство погибло в обрушившихся зданиях и последовавшем пожаре.`},{id:`woodward-1947`,ef:5,scale:`F5`,name:`Вудворд`,place:`Оклахома, США`,lat:36.43,lon:-99.39,date:`1947-04-09`,deaths:181,injured:970,pathKm:158,widthM:3e3,windKmh:null,note:`Самый смертоносный смерч в истории Оклахомы. Ширина доходила до двух миль, путь через три штата. Предупреждений не было: слово «торнадо» в сводках тогда ещё оставалось под запретом, и первую официальную тревогу выпустят только через год.`},{id:`xenia-1974`,ef:5,scale:`F5`,name:`Ксения`,place:`Огайо, США`,lat:39.68,lon:-83.93,date:`1974-04-03`,deaths:32,injured:1150,pathKm:26,widthM:800,windKmh:null,note:`Самый разрушительный смерч Супервспышки 1974 года — 148 смерчей за восемнадцать часов, до 2011 года это была крупнейшая вспышка в истории наблюдений. Половина города перестала существовать за четыре минуты.`},{id:`wichitafalls-1979`,ef:4,scale:`F4`,name:`Уичито-Фолс`,place:`Техас, США`,lat:33.91,lon:-98.49,date:`1979-04-10`,deaths:42,injured:1800,pathKm:76,widthM:2400,windKmh:null,note:`«Ужасный вторник». Двадцать пять из сорока двух погибших были в автомобилях — люди пытались уехать от смерча по забитым дорогам. После этого случая правило «не убегать на машине, а искать укрытие» вошло во все инструкции.`},{id:`barneveld-1984`,ef:5,scale:`F5`,name:`Барневелд`,place:`Висконсин, США`,lat:43.02,lon:-89.9,date:`1984-06-08`,deaths:9,injured:200,pathKm:58,widthM:400,windKmh:null,note:`Ударил около часа ночи по спящему посёлку. Сирену снесло первым же порывом, и предупредить оставшихся было уже нечем. Из девяноста процентов построек не осталось ничего выше фундамента.`},{id:`plainfield-1990`,ef:5,scale:`F5`,name:`Плейнфилд`,place:`Иллинойс, США`,lat:41.63,lon:-88.2,date:`1990-08-28`,deaths:29,injured:350,pathKm:26,widthM:800,windKmh:null,note:`Единственный F5, зафиксированный в США в августе. Предупреждение не выпускалось вовсе: смерч был скрыт стеной дождя и не давал классической подписи на радаре. Этот случай стал одним из доводов за переход сети на доплеровские радары.`},{id:`andover-1991`,ef:5,scale:`F5`,name:`Андовер`,place:`Канзас, США`,lat:37.71,lon:-97.14,date:`1991-04-26`,deaths:17,injured:225,pathKm:74,widthM:800,windKmh:null,note:`Один из самых снятых смерчей своего времени: его вели сразу несколько групп исследователей. Тринадцать из семнадцати погибших были в парке автоприцепов — самом уязвимом типе жилья при смерче.`},{id:`hallam-2004`,ef:4,scale:`F4`,name:`Халлам`,place:`Небраска, США`,lat:40.53,lon:-96.79,date:`2004-05-22`,deaths:1,injured:37,pathKm:87,widthM:4e3,windKmh:null,note:`Четыре километра в поперечнике — до Эль-Рино 2013 года это был самый широкий смерч за всю историю наблюдений. Погиб один человек: местность вокруг почти не застроена, и это единственная причина.`},{id:`hackleburg-2011`,ef:5,scale:`EF5`,name:`Хаклберг — Фил-Кэмпбелл`,place:`Алабама, США`,lat:34.28,lon:-87.83,date:`2011-04-27`,deaths:72,injured:null,pathKm:212,widthM:2e3,windKmh:340,note:`Самый смертоносный смерч Супервспышки 2011 года — той самой, что за сутки дала более трёхсот пятидесяти подтверждённых смерчей. Шёл 212 км почти без ослабления.`},{id:`smithville-2011`,ef:5,scale:`EF5`,name:`Смитвилл`,place:`Миссисипи, США`,lat:34.07,lon:-88.39,date:`2011-04-27`,deaths:23,injured:137,pathKm:39,widthM:800,windKmh:330,note:`Тот же день, что и Хаклберг. Автомобили находили в сотнях метров от того места, где они стояли, а с бетонных плит был содран асфальт — признаки, по которым обследование и присвоило высшую категорию.`},{id:`sanjusto-1973`,ef:5,scale:`F5`,name:`Сан-Хусто`,place:`Санта-Фе, Аргентина`,lat:-30.78,lon:-60.58,date:`1973-01-10`,deaths:63,injured:350,pathKm:null,widthM:null,windKmh:null,note:`Самый сильный смерч, когда-либо зарегистрированный в Южном полушарии — единственный F5 за его пределами Северной Америки и Евразии. Официальную категорию присвоили только в 2017 году, спустя сорок четыре года, после повторного разбора сохранившихся снимков разрушений.`},{id:`funing-2016`,ef:4,scale:`EF4`,name:`Фунин`,place:`Яньчэн, Цзянсу, Китай`,lat:33.79,lon:119.85,date:`2016-06-23`,deaths:98,injured:846,pathKm:null,widthM:null,windKmh:null,note:`Самый смертоносный смерч Китая за сорок лет и первый, официально подтверждённый там как EF4. Родился из суперячейки — структуры, которую в Китае долго считали редкой, пока не появилась плотная радарная сеть.`},{id:`edmonton-1987`,ef:4,scale:`F4`,name:`Эдмонтон`,place:`Альберта, Канада`,lat:53.55,lon:-113.49,date:`1987-07-31`,deaths:27,injured:300,pathKm:40,widthM:1e3,windKmh:null,note:`«Чёрная пятница» — второй по числу жертв смерч в истории Канады. Держался на земле целый час, что для этих широт исключительно долго. После него в стране построили национальную систему оповещения о смерчах.`},{id:`daulatpur-1989`,ef:null,scale:`не оценён`,name:`Даулатпур — Сатурия`,place:`Маникгандж, Бангладеш`,lat:23.9,lon:90,date:`1989-04-26`,deaths:1300,injured:12e3,pathKm:80,widthM:1600,windKmh:null,note:`Самый смертоносный смерч в мировой истории — около 1300 погибших. Официального рейтинга нет: шкала Фудзиты применяется по обследованию разрушений, а в Бангладеш такой службы не было. Дельта Ганга — второй по активности смерчевой район планеты после Великих равнин, но система предупреждения там слабее.`},{id:`ivanovo-1984`,ef:5,scale:`F5`,name:`Ивановский смерч`,place:`Ивановская область, Россия`,lat:57,lon:41,date:`1984-06-09 рхушка облака, тем выше она забралась — по этому каналу и опознают мощную конвекцию: у грозы с пробитой тропопаузой верхушка холоднее минус шестидесяти.`},{id:`goes19-sandwich`,cat:`sat`,title:`GOES-19 · «сэндвич»`,sub:`Видимый канал поверх инфракрасного`,url:`https://cdn.star.nesdis.noaa.gov/GOES19/ABI/CONUS/Sandwich/1250x750.jpg`,every:`5 минут`,ratio:1250/750,note:`Наложение двух каналов сразу: фактура облака берётся из видимого, а цвет — из инфракрасного. Получается картинка, где одновременно видно и рельеф верхушки, и насколько она холодная. Рабочий продукт синоптиков при разборе гроз.`},{id:`goes19-airmass`,cat:`sat`,title:`GOES-19 · воздушные массы`,sub:`RGB-композит из каналов водяного пара и озона`,url:`https://cdn.star.nesdis.noaa.gov/GOES19/ABI/FD/AirMass/678x678.jpg`,every:`10 минут`,ratio:1,note:`Не фотография, а раскраска по разнице каналов. Сухой воздух из стратосферы получается красным, влажный тропический — зелёным. По границам этих цветов видно струйное течение и фронтальные разделы, которых на обычном снимке нет.`},{id:`goes18-fd`,cat:`sat`,title:`GOES-18 · Тихий океан`,sub:`Западный спутник, полный диск`,url:`https://cdn.star.nesdis.noaa.gov/GOES18/ABI/FD/GEOCOLOR/1808x1808.jpg`,every:`10 минут`,ratio:1,note:`Спутник над 137° з. д. Здесь рождаются тихоокеанские тайфуны и отсюда приходит погода на всё западное побережье.`},{id:`radar-loop`,cat:`radar`,title:`Радарная петля · США`,sub:`Сводная отражаемость, анимация`,url:`https://radar.weather.gov/ridge/standard/CONUS_loop.gif`,every:`несколько минут`,ratio:1.6,note:`Готовая анимация службы погоды: последние кадры базовой отражаемости всех радаров сети NEXRAD, сшитые в петлю. Тот же продукт, что в слое «отражаемость» на карте, только уже с историей движения.`},{id:`radar-sp`,cat:`radar`,title:`Радар · Южные равнины`,sub:`Отражаемость над смерчевым поясом`,url:`https://radar.weather.gov/ridge/standard/SOUTHPLAINS_loop.gif`,every:`несколько минут`,ratio:1.35,note:`Тот же радарный продукт, но крупнее и только по аллее смерчей. На таком масштабе уже различима форма ячейки — в том числе крюкообразный отголосок, по которому и опознают смерчевую суперячейку.`},{id:`radar-se`,cat:`radar`,title:`Радар · Юго-восток США`,sub:`Отражаемость, побережье Мексиканского залива`,url:`https://radar.weather.gov/ridge/standard/SOUTHEAST_loop.gif`,every:`несколько минут`,ratio:1.35,note:`Второй по активности смерчевой район страны — Дикси. Смерчи здесь чаще ночные и приходят вместе с фронтом, а не с одиночной ячейкой, поэтому картина на радаре совсем другая: длинная линия вместо отдельных пятен.`},{id:`wpc-sfc`,cat:`chart`,title:`Приземный анализ · WPC`,sub:`Фронты, центры давления, изобары`,url:`https://www.wpc.ncep.noaa.gov/sfc/lrgnamsfcwbg.gif`,every:`3 часа`,ratio:1.3,note:`Классическая синоптическая карта, которую рисует дежурный синоптик Центра прогнозов погоды. Холодные фронты — треугольниками, тёплые — полукружиями, линии равного давления через 4 гПа. Именно с этой карты начинается любой разбор погоды, и она почти не изменилась за сто лет.`},{id:`nhc-atl`,cat:`chart`,title:`Тропический прогноз · NHC`,sub:`Вероятность образования циклонов на 7 дней`,url:`https://www.nhc.noaa.gov/xgtwo/two_atl_7d0.png`,every:`6 часов`,ratio:1.45,note:`Официальный прогноз Национального центра ураганов по Атлантике: обведены области, где в ближайшую неделю может зародиться тропический циклон, с вероятностью в процентах. Ровно та картинка, по которой объявляют готовность на побережье.`}],Aa=[{name:`Поиск живых эфиров о смерчах`,url:`https://www.youtube.com/results?search_query=tornado+live+storm+chaser&sp=EgJAAQ%253D%253D`},{name:`Ryan Hall, Y'all`,url:`https://www.youtube.com/@RyanHallYall/streams`},{name:`Max Velocity`,url:`https://www.youtube.com/@MaxVelocityWX/streams`},{name:`Reed Timmer`,url:`https://www.youtube.com/@ReedTimmerWx/streams`},{name:`Прогнозы SPC (официально)`,url:`https://www.spc.noaa.gov/`}]})),Ma=r({default:()=>Pa});function Na(e){let t=(0,Fa.useRef)(null),n=(0,Fa.useCallba иком. Системная просьба «уменьшить движение» сильнее её.`,`Синяя точка на карте — ваше место. По обычному HTTP браузер координат не отдаёт, но есть кнопка «указать вручную»: ткни в карту, и точка встанет туда.`,`В «эфире» кадр можно обновить вручную. Спутник сам обновляется раз в пять-десять минут.`,`За 50 м/с поверх шкалы загорается второй круг с частицами. Это граница урагана третьей категории — «мощный» по шкале Саффира–Симпсона.`,`Датчик станции меряет до 30 м/с, и прошивка обрезает показание на этой отметке. Второй круг там не появится: нечем измерить пятьдесят.`,`Вкладка МЕТЕОРОЛОГИЯ делится на три: приборы к покупке, полевые зонды и учебник по смерчам. У карточек есть фильтры.`,`Фотографии в справочнике подгружаются из интернета. На копии, отданной самой станцией, их не будет — у неё нет выхода наружу, останутся чертежи.`,`В демо есть заготовки: «Шквал», «Ураган», «Рекорд Земли». Одно нажатие — и весь дашборд оказывается в этом состоянии, включая радар и розу.`,`Порог тревоги можно сдвинуть в дополнительных настройках: от 7 до 10 баллов по Бофорту.`,`Кнопка «Спросить Claude» открывает чат с уже написанным вопросом и описанием станции — объяснять заново, что это за прибор, не придётся.`,`Подложку можно сменить с чёрной на графит или чернила. Светлой нет намеренно: светящийся текст по белому не работает.`,`«Плотная» вёрстка убирает воздух внутри панелей — на телефоне влезает заметно больше.`,`Если ветер сорвался в шквал, посмотри РАДАР → ПРОФИЛЬ: там видно, по какому именно признаку это определено.`,`Историю и розу ветров можно очистить кнопкой в дополнительных настройках, не перезагружая страницу.`],za=`Мезомасштаб — это от 2 до 2000 км: бризы, шквальные линии, грозовые комплексы. Меньше — микромасштаб, больше — синоптика.(Шкала Бофорта старше приборов. Фрэнсис Бофорт составил её в 1805 году по тому, сколько парусов мог нести линейный корабль.(Нисходящий шквал открыл Тэцуя Фудзита — тот же, чья шкала. Он доказал, что самолёты на посадке роняет падающий столб воздуха, а не сдвиг ветра.(Дерехо — шторм по прямой: полоса разрушений не короче 400 км при порывах от 26 м/с. Там не крутит, там сносит.(Мезоциклон — вращающийся восходящий поток внутри грозы, 2–10 км в поперечнике. Смерч рождается меньше чем в одном из пяти.(Морской бриз — настоящий мезомасштабный фронт. Суша греется быстрее воды, и к полудню разница давления гонит воздух с моря.(Обычная гроза живёт около получаса — ровно столько, сколько нужно нисходящему потоку, чтобы задушить питающий её восходящий.(Порыв и средняя скорость — разные величины. ВМО считает порывом максимум за 3 секунды, а среднюю берёт за 10 минут.(Коэффициент порывистости над городом доходит до 2 и выше. Над открытым морем он редко превышает 1.2 — там нечему рвать поток.(Фронт порывов обгоняет саму грозу на 10–20 км. Поэтому резкий холодный ветер приходит раньше дождя.(Смерч в северном полушарии крутится против часовой не из-за силы Кориолиса напрямую — масштаб для неё слишком мал. Вращение он наследует от мезоциклона.(Самая высокая скорость ветра у поверхности Земли — 484 км/ч. Бридж-Крик, Оклахома, 3 мая 1999 года, измерено мобильным доплеровским радаром.(Аллея смерчей существует из-за слоёного пирога: сухой воздух со Скалистых гор ложится поверх влажного с Мексиканского залива. Больше нигде это не собирается так регулярно.(Второй по активности смерчевой район планеты — дельта Ганга. Самый смертоносный смерч в истории прошёл именно там, в Бангладеш в 1989 году.(Чашечный анемометр придумал Джон Робинсон в 1846 году. Принцип с тех пор не изменился — считать оборот и умножить.(Интенсивность турбулентности — это σ, поделённая на среднюю скорость. Выше 25 % воздух конвективно неустойчив.(Стандартная высота измерения ветра по ВМО — 10 метров над открытой поверхностью. На двух метрах скорость ниже примерно на четверть.(Категорию EF смерчу присваивают только после наземного обследования разрушений, обычно через день-два. У идущего смерча рейтинга не существует.(Микровспышка — нисходящий шквал меньше 4 км в поперечнике. Живёт пять-десять минут и успевает выдать порывы до 75 м/с.(Стена облаков под основанием грозы — это не сам смерч, а видимая часть мезоциклона. Воронка, если будет, опустится из неё.(Шельфовое облако выглядит страшнее смерча и вызывает больше ложных тревог, чем всё остальное. Но оно противоположность: там воздух выбрасывается из грозы, а не втягивается.(Тонкий «верёвочный» смерч не значит слабый. Сжимаясь, вихрь по закону сохранения момента импульса раскручивается сильнее — люди гибли именно в этой фазе.(Ширина смерча не равна силе. Эль-Рино 2013 был самым широким в истории — 4.2 км — и получил всего EF3: он шёл по пустой местности, а категорию дают по разрушениям.(Радиозонды по всему миру запускают одновременно, в 00 и 12 UTC. Это самая старая работающая система глобальных наблюдений — с тридцатых годов.(Двойная поляризация радара умеет отличать обломки от дождя. Если на экране появилась их отметка — смерч уже на земле, даже если его никто не видит.(У суперячейки осадки смещены в сторону от восходящего потока. Поэтому смерч видно отдельно от стены дождя — иначе его не было бы видно вовсе.(Мезоциклон живёт часами, обычная гроза — полчаса. Разница в том, что вращение разводит восходящий и нисходящий потоки, и гроза перестаёт душить сама себя.(Пыльные вихри на Марсе достигают восьми километров в высоту и оставляют следы, видимые с орбиты. Марсоходам Spirit и Opportunity они не раз чистили солнечные панели — те проработали годы вместо расчётных 90 суток.(Слово «торнадо» в сводках службы погоды США было под неофициальным запретом до 1938 года: считалось, что оно сеет панику. Первое официальное предупреждение выпустили только в 1948-м.(Элвису Пресли был год, когда смерч 1936 года снёс Тьюпело, где он родился. Он и его мать оказались среди выживших.(Шкалу Бофорта придумали для парусного флота: балл определялся тем, сколько парусов может нести линейный корабль. Приборов в 1805 году просто не было.(Самая длинная зафиксированная молния протянулась на 768 км — от Техаса до Миссисипи. Один разряд длиной с целую страну.(Тэцуя Фудзита вывел существование нисходящих шквалов, разглядывая узор поваленных деревьев: они лежали не по кругу, как у смерча, а расходились звездой от центра.(Град растёт слоями, как луковица: капля многократно поднимается и опускается в грозе, каждый раз намерзая. По срезу градины можно посчитать, сколько раз она сходила вверх.(Рекордный порыв ветра у поверхности Земли — 113 м/с, остров Барроу в Австралии, 1996 год, циклон Оливия. Это 408 км/ч.(Запах перед грозой имеет имя: петрикор. Он появляется, когда капли выбивают из сухой почвы масла, накопленные растениями.(Молния бьёт в самолёты регулярно — примерно раз в год на борт. Обшивка работает клеткой Фарадея, и пассажиры обычно ничего не замечают.(В глазу урагана бывает солнечно и почти безветренно. Это самое опасное затишье в метеорологии: через полчаса ветер вернётся с той же силой, но с обратной стороны.(Одна гроза средних размеров несёт энергию порядка десятка атомных бомб — но растянутую на полчаса и по кубическим километрам воздуха.(Снежинка падает со скоростью около метра в секунду, а градина — до пятидесяти. Разница только в том, успела вода замёрзнуть плотно или нет.`.split(`(`),Ba=`wind_ui_tutor_done`,Va=`wind_ui_tutor_sound`})),Ua=r({default:()=>Wa});function Wa({g:e}){let t=typeof window<`u`&&!!window.isSecureContext;typeof window<`u`&&window.location.protocol;let[n,r]=(0,Ga.useState)({}),[i,a]=(0,Ga.useState)(null),[o,s]=(0,Ga.useState)(null),c=(0,Ga.useCallback)(async()=>{let e={};for(let n of qa){if(!n.check()){e[n.id]=`unavailable`;continue}if(n.needsSecure&&!t){e[n.id]=`unavailable`;continue}if(n.id===`notifications`){e[n.id]=Notification.permission;continue}if(n.id===`storage`){e[n.id]=navigator.storage.persisted&&await navigator.storage.persisted()?`granted`:`prompt`;continue}if(navigator.permissions?.query)try{let t=await navigator.permissions.query({name:n.api});e[n.id]=t.state;continue}catch{}e[n.id]=`prompt`}r(e)},[t]);(0,Ga.us ид 18 см, 4 лопасти`],[`Габариты`,`55 × 37 см, 1.0 кг`],[`Шаг винта`,`29.4 см на оборот`]],why:`Разработан для океанских буёв, поэтому переносит то, что убивает обычные приборы: солёный туман, обледенение, годы без обслуживания. Меряет скорость и направление одним корпусом — флюгер разворачивает винт строго навстречу потоку. Стоит на мачтах по всему миру и служит негласной точкой отсчёта, с которой сравнивают остальные.`,caveat:`Порог 1 м/с высоковат: слабый ветер он просто не видит. Для климатологии штилей берут ультразвук.`,url:`https://www.youngusa.com/product/wind-monitor/`},{id:`thiesfca`,photo:`cups`,cat:`wind`,art:`cups`,name:`Thies First Class Advanced`,kind:`Чашечный`,tag:`класс 0.9`,specs:[[`Диапазон`,`0.3–75 м/с`],[`Порог`,`менее 0.3 м/с`],[`Погрешность`,`1% или ±0.2 м/с (0.3–50 м/с)`],[`Класс`,`0.9 по IEC 61400-12-1`]],why:`Отраслевой эталон ветроэнергетики: по его показаниям считают, окупится ли ветропарк, поэтому к точности требования жёстче, чем в обычной метеорологии. Три чашки — древнейшая схема измерения ветра, дожившая до наших дней именно потому, что её невозможно сбить с толку.`,caveat:`Чашки инерционны: при резких порывах они «переслеживают» — раскручиваются быстрее, чем тормозят, и слегка завышают среднее.`,url:`https://www.thiesclima.com/`},{id:`windsonic`,photo:`sonic2d`,cat:`wind`,art:`sonic2d`,name:`Gill WindSonic`,kind:`Ультразвуковой, две оси`,tag:`без движущихся частей`,specs:[[`Диапазон`,`0–60 м/с`],[`Порог`,`0.01 м/с`],[`Погрешность`,`2% СКО при 12 м/с · ±3°`],[`Принцип`,`время пролёта звука между парами преобразователей`]],why:`Считает скорость по разнице времени, за которое ультразвук проходит между преобразователями по ветру и против. Двигаться нечему — нет подшипников, нечему изнашиваться и нечего смазывать. Порог 0.01 м/с: видит движение воздуха, которого человек не чувствует.`,caveat:`Боится налипшего льда и сильного дождя: капля на преобразователе портит отсчёт. Обогрев есть не во всех исполнениях.`,url:`https://gillinstruments.com/products/anemometer/windsonic.htm`},{id:`sonic3d`,photo:`sonic3d`,cat:`wind`,art:`sonic3d`,name:`Трёхосевой ультразвук`,kind:`Campbell CSAT3B, Gill HS-50`,tag:`турбулентность`,specs:[[`Частота`,`10–100 Гц`],[`Измеряет`,`три компоненты скорости и акустическую температуру`],[`Применение`,`метод вихревой ковариации`]],why:`Меряет не средний ветер, а сам вихрь: сто отсчётов в секунду по трём осям позволяют посчитать, сколько тепла, влаги и углекислого газа поток уносит вверх. На этих приборах держится вся современная наука о приземном слое.`,caveat:`Дорог, требует питания и хранения гигабайт сырых рядов. Для «просто посмотреть ветер» бессмыслен.`,url:`https://www.campbellsci.com/csat3b`},{id:`young03002`,cat:`wind`,art:`cupvane`,name:`R.M. Young 03002 Wind Sentry`,kind:`Чашки плюс флюгер`,tag:`рабочая лошадка`,specs:[[`Диапазон`,`0–50 м/с`],[`Порог`,`около 0.5 м/с чашки · 0.8 м/с флюгер`],[`Устройство`,`три чашки и отдельный флюгер на общей траверсе`]],why:`Тот же производитель, но вчетверо дешевле 05103 и заметно чувствительнее на слабом ветре. Классическая схема с раздельными чашками и флюгером: если что-то сломается, менять придётся только половину.`,caveat:`Две подвижные оси вместо одной — вдвое больше подшипников, которые надо переживать.`,url:`https://www.youngusa.com/product/wind-sentry-set/`},{id:`davis6410`,cat:`wind`,art:`cupvane`,name:`Davis 6410`,kind:`Чашки плюс флюгер`,tag:`для любителя`,specs:[[`Диапазон`,`около 1–90 м/с`],[`Погрешность`,`порядка ±5%`],[`Интерфейс`,`геркон на скорость, потенциометр на направление`]],why:`Самый распространённый анемометр у любительских станций, и не зря: выход — обычные импульсы и напряжение, поэтому он подключается к любой плате буквально тремя проводами. Именно с него начинается большинство самодельных метеостанций.`,caveat:`Точность любительская. Для наблюдений «какая сегодня погода» отличен, для отчётности — нет.`,url:`https://www.davisinstruments.com/`},{id:`kestrel`,cat:`wind`,art:`handheld`,name:`Kestrel 5500`,kind:`Ручной крыльчатый`,tag:`в кармане`,specs:[[`Диапазон`,`около 0.6–40 м/с`],[`Погрешность`,`порядка ±3%`],[`Ещё меряет`,`температуру, влажность, давление, точку росы`]],why:`Карманная метеостанция: крыльчатка на 25 мм и набор датчиков в корпусе размером с рацию. Незаменима, когда надо померить ветер там, где мачты нет и не будет — на склоне, на палубе, на старте.`,caveat:`Показания зависят от того, как держать: крыльчатку надо направлять точно в поток, иначе занижает.`,url:`https://kestrelinstruments.com/`},{id:`hotwire`,photo:`hotwire`,cat:`wind`,art:`hotwire`,name:`Термоанемометр`,kind:`Нагретая нить`,tag:`слабые потоки`,specs:[[`Диапазон`,`обычно 0–30 м/с`],[`Разрешение`,`до 0.01 м/с`],[`Принцип`,`поток охлаждает нить, ток удержания температуры и есть сигнал`]],why:`Единственный способ уверенно померить движение воздуха доли метра в секунду: механике на таких скоростях не хватает момента, чтобы стронуться. Основной инструмент вентиляционщиков и аэродинамиков.`,caveat:`Не показывает направление и не любит улицу: пыль на нити меняет теплоотдачу и уводит калибровку.`,url:`https://www.testo.com/`},{id:`pitot`,photo:`pitot`,cat:`wind`,art:`pitot`,name:`Трубка Пито`,kind:`Динамическое давление`,tag:`авиация`,specs:[[`Принцип`,`разность полного и статического давления`],[`Диапазон`,`от нескольких м/с до сверхзвука`],[`Особенность`,`скорость растёт как корень из перепада`]],why:`Прибор, по которому летают самолёты. Никаких подвижных частей и почти неограниченный верхний предел — потому и стоит на каждом крыле и в каждой аэродинамической трубе.`,caveat:`Внизу шкалы бесполезен: при 2 м/с перепад давления уже на уровне шума, а обледеневшая трубка врёт молча — отсюда несколько катастроф в истории авиации.`,url:`https://www.grc.nasa.gov/www/k-12/airplane/pitot.html`},{id:`tipping`,photo:`tipping`,cat:`rain`,art:`raingauge`,name:`Опрокидывающийся дождемер`,kind:`Young 52202, Davis AeroCone`,tag:`стандарт осадков`,specs:[[`Цена деления`,`0.1 или 0.2 мм на опрокидывание`],[`Приёмник`,`обычно 200 или 254 см²`],[`Выход`,`импульс геркона на каждое опрокидывание`]],why:`Воронка собирает дождь в качельку из двух ковшиков: наполнился один — перевесил, вылился, подставился второй, геркон дал импульс. Механика на два подвижных элемента, которая работает десятилетиями.`,caveat:`Ветер сдувает часть капель мимо воронки — недобор при 10 м/с доходит до десятков процентов. Снег без обогрева не мерит вовсе, а при ливне занижает: часть воды проливается за время опрокидывания.`,url:`https://www.youngusa.com/product/tipping-bucket-rain-gauge/`},{id:`disdro`,photo:`disdro`,cat:`rain`,art:`disdrometer`,name:`Дисдрометр`,kind:`Thies LPM, OTT Parsivel`,tag:`капля за каплей`,specs:[[`Меряет`,`размер и скорость каждой частицы`],[`Различает`,`дождь, морось, снег, крупу, град`],[`Принцип`,`лазерная пелена между двумя головками`]],why:`Между головками натянута плоская лазерная пелена. Каждая капля, пересекая её, затеняет луч: по глубине провала считается размер, по длительности — скорость падения. Отсюда берут распределение капель по размерам, без которого нельзя пересчитать отражаемость радара в осадки.`,caveat:`Дорог и требует чистых окошек. Сильный ветер сносит частицы под углом и путает оценку скорости.`,url:`https://www.thiesclima.com/`},{id:`hmp155`,photo:`aws`,cat:`air`,art:`probe`,name:`Vaisala HMP155`,kind:`Температура и влажность`,tag:`эталон воздуха`,specs:[[`Температура`,`−80…+60 °C, погрешность порядка ±0.1 °C`],[`Влажность`,`0–100%, около ±1% в основном диапазоне`],[`Обязательно`,`радиационный экран`]],why:`Референсный зонд, по которому поверяют остальные. Ёмкостный чувствительный элемент HUMICAP — изобретение Vaisala, ставшее отраслевым стандартом.`,caveat:`Сам по себе бесполезен: без экрана он покажет температуру солнца на своём корпусе, а не воздуха. Экран здесь важнее датчика.`,url:`https://www.vaisala.com/`},{id:`shield`,photo:`shield`,cat:`air`,art:`shield`,name:`Радиационный экран`,kind:`Многопластинчатый или будка Стивенсона`,tag:`важнее датчика`,specs:[[`Задача`,`закрыть датчик от солнца, оставив продув`],[`Исполнения`,`пассивный, естественной или принудительной вентиляции`],[`Ошибка без него`,`до нескольких градусов в солнечный штиль`]],why:`Не датчик, а то, без чего датчик врёт. Белые тарелки перекрывают прямой и отражённый свет, но оставляют воздуху дорогу. Ошибка неэкранированного термометра днём при слабом ветре доходит до нескольких градусов — больше, чем разница между хорошим и плохим сенсором.`,caveat:`Пассивный экран в штиль греется сам. Аспирированный точнее, но требует питания вентилятора круглосуточно.`,url:`https://www.youngusa.com/product/compact-aspirated-radiation-shield/`},{id:`bme280`,cat:`air`,art:`chip`,name:`Bosch BME280 / BME680`,kind:`Температура, влажность, давление`,tag:`для самодельной станции`,specs:[[`Давление`,`300–1100 гПа, около ±1 гПа`],[`Температура`,`около ±0.5 °C`],[`Влажность`,`около ±3%`],[`Интерфейс`,`I²C или SPI, питание 3.3 В`]],why:`Три величины в корпусе размером с рисовое зерно за копейки. Именно этот датчик стоит добавить к нашей станции: дашборд уже умеет показывать температуру, влажность и давление — карточки появятся сами, как только прошивка пришлёт флаги присутствия.`,caveat:`Греется от собственной платы: если посадить его рядом с ESP32, температура завышается на градус-два. Выносить на проводах и обязательно в экран.`,url:`https://www.bosch-sensortec.com/products/environmental-sensors/humidity-sensors-bme280/`},{id:`ptb110`,photo:`baro`,cat:`air`,art:`baro`,name:`Барометр Vaisala PTB110`,kind:`Атмосферное давление`,tag:`барическая тенденция`,specs:[[`Диапазон`,`500–1100 гПа`],[`Погрешность`,`порядка ±0.3 гПа`],[`Важно`,`приведение к уровню моря по высоте станции`]],why:`Само значение давления говорит мало — важна тенденция. Падение на 3 гПа за три часа означает подход фронта надёжнее любого другого одиночного признака, и именно по нему предсказывали погоду за век до спутников.`,caveat:`Требует знания высоты установки: без приведения к уровню моря показания несопоставимы даже с соседней станцией.`,url:`https://www.vaisala.com/`},{id:`pyrano`,photo:`pyrano`,cat:`sun`,art:`pyrano`,name:`Пиранометр`,kind:`Kipp & Zonen CMP, Apogee SP-110`,tag:`солнечный поток`,specs:[[`Меряет`,`суммарную солнечную радиацию, Вт/м²`],[`Термоэлектрический`,`класс A по ISO 9060, широкий спектр`],[`Кремниевый`,`дешевле, но спектр уже и точность ниже`]],why:`Под стеклянным куполом лежит термобатарея: чёрная поверхность греется от солнца, спай даёт напряжение. Купол пропускает нужный спектр и держит ветер снаружи, чтобы прибор мерил свет, а не обдув.`,caveat:`Требует горизонтирования по пузырьковому уровню и чистого купола: пыль и роса занижают показания, а наклон в градус — заметная ошибка.`,url:`https://www.kippzonen.com/`},{id:`as3935`,cat:`storm`,art:`lightning`,name:`AS3935 Franklin`,kind:`Детектор грозовых разрядов`,tag:`гроза для самоделки`,specs:[[`Дальность`,`до 40 км`],[`Выдаёт`,`оценку расстояния до фронта грозы и энергию разряда`],[`Принцип`,`приём электромагнитного импульса на рамочную антенну`],[`Интерфейс`,`I²C или SPI`]],why:`Единственный доступный способ поставить на самодельную станцию настоящее обнаружение грозы. Ловит электромагнитный импульс разряда и по его форме оценивает, насколько далеко фронт. Дашборд считает признаки шквала по анемометру — этот датчик добавил бы к ним то, чего ветром не увидеть.`,caveat:`Ложно срабатывает на импульсные блоки питания, люминесцентные лампы и щётки моторов. Требует настройки порога и разумного удаления от электроники.`,url:`https://ams-osram.com/products/sensor-solutions/position-sensors/ams-as3935-franklin-lightning-sensor`}],ao=`https://upload.wikimedia.org/wikipedia/commons/thumb/`,oo=`https://commons.wikimedia.org/wiki/File:`,so={young:{u:`7/71/Young_wind_monitor.jpg/500px-Young_wind_monitor.jpg`,lic:`CC BY-SA 3.0`,by:`CambridgeBayWeather`,f:`Young wind monitor.jpg`},cups:{u:`1/1b/Anemometer.jpg/500px-Anemometer.jpg`,lic:`CC BY 3.0`,by:`Stefan Kühn`,f:`Anemometer.jpg`},sonic2d:{u:`e/ed/Ultrasonic_anemometer_at_Whim_Moss_-_geograph.org.uk_-_3290227.jpg/500px-Ultrasonic_anemometer_at_Whim_Moss_-_geograph.org.uk_-_3290227.jpg`,lic:`CC BY-SA 2.0`,by:`M J Richardson`,f:`Ultrasonic anemometer at Whim Moss - geograph.org.uk - 3290227.jpg`},sonic3d:{u:`c/c6/Ultrasonic_3D_anemometer%2C_R._M._Young_Company%2C_2010_-_Museum_of_Science_and_Industry_%28Chicago%29_-_DSC06371.JPG/500px-Ultrasonic_3D_anemometer%2C_R._M._Young_Company%2C_2010_-_Museum_of_Science_and_Industry_%28Chicago%29_-_DSC06371.JPG`,lic:`CC0`,by:`Daderot`,f:`Ultrasonic 3D anemometer, R. M. Young Company, 2010 - Museum of Science and Industry (Chicago) - DSC06371.JPG`},tipping:{u:`9/90/Interior_tipping_bucket.JPG/500px-Interior_tipping_bucket.JPG`,lic:`общественное достояние`,by:`Cambridge Bay Weather`,f:`Interior tipping bucket.JPG`},disdro:{u:`6/69/Optical_disdrometers_of_NASA.jpg/500px-Optical_disdrometers_of_NASA.jpg`,lic:`общественное достояние`,by:`NASA`,f:`Optical disdrometers of NASA.jpg`},shield:{u:`f/fe/Stevenson_screen_exterior.JPG/500px-Stevenson_screen_exterior.JPG`,lic:`общественное достояние`,by:`Викисклад`,f:`Stevenson screen exterior.JPG`},pyrano:{u:`d/d8/Pyranometr_CMP22.jpg/500px-Pyranometr_CMP22.jpg`,lic:`CC BY-SA 4.0`,by:`A. Kardaś`,f:`Pyranometr CMP22.jpg`},baro:{u:`4/4b/Modern_Aneroid_Barometer.jpg/500px-Modern_Aneroid_Barometer.jpg`,lic:`общественное достояние`,by:`Викисклад`,f:`Modern Aneroid Barometer.jpg`},hotwire:{u:`7/75/HitzedrahtAnemometer.jpg/500px-HitzedrahtAnemometer.jpg`,lic:`CC BY 4.0`,by:`Ralf Pfeifer`,f:`HitzedrahtAnemometer.jpg`},pitot:{u:`a/a4/B777-381_JA8752_nose_Pitot_tube_ja.jpg/500px-B777-381_JA8752_nose_Pitot_tube_ja.jpg`,lic:`общественное достояние`,by:`Cassiopeia sweet`,f:`B777-381 JA8752 nose Pitot tube ja.jpg`},aws:{u:`9/92/Bird%27s_Hill_Climate_Station%2C_Colton_Cross_-_geograph.org.uk_-_686982.jpg/500px-Bird%27s_Hill_Climate_Station%2C_Colton_Cross_-_geograph.org.uk_-_686982.jpg`,lic:`CC BY-SA 2.0`,by:`Rabbi WP Thinrod`,f:`Bird's Hill Climate Station, Colton Cross - geograph.org.uk - 686982.jpg`},tiv:{u:`4/4f/Tornado_Intercept_Vehicle_2.jpg/500px-Tornado_Intercept_Vehicle_2.jpg`,lic:`CC BY-SA 2.0`,by:`James Bastow`,f:`Tornado Intercept Vehicle 2.jpg`},dow:{u:`b/be/Doppler_on_Wheels_6_%28DOW_6%29_2009_VORTEX_2.jpg/500px-Doppler_on_Wheels_6_%28DOW_6%29_2009_VORTEX_2.jpg`,lic:`общественное достояние`,by:`VORTEX2`,f:`Doppler on Wheels 6 (DOW 6) 2009 VORTEX 2.jpg`},mesonet:{u:`8/83/Mobile_mesonet_2017_TORUS_Project.jpg/500px-Mobile_mesonet_2017_TORUS_Project.jpg`,lic:`общественное достояние`,by:`проект TORUS`,f:`Mobile mesonet 2017 TORUS Project.jpg`},nexrad:{u:`9/9e/NEXRAD_tower_US_Naional_Weather_Service_Negaunee_Township_Michigan.jpg/500px-NEXRAD_tower_US_Naional_Weather_Service_Negaunee_Township_Michigan.jpg`,lic:`CC BY 3.0`,by:`Pierre cb`,f:`NEXRAD tower US Naional Weather Service Negaunee Township Michigan.jpg`},hunters:{u:`f/fe/Hurricane_Hunters_gather_forecast_data_on_record-breaking_blizzard_160123-F-UY948-002.jpg/500px-Hurricane_Hunters_gather_forecast_data_on_record-breaking_blizzard_160123-F-UY948-002.jpg`,lic:`общественное достояние`,by:`Ник Монтелеоне, ВВС США`,f:`Hurricane Hunters gather forecast data on record-breaking blizzard 160123-F-UY948-002.jpg`},sonde:{u:`7/7e/Launching_radiosonde_1943.jpg/500px-Launching_radiosonde_1943.jpg`,lic:`общественное достояние`,by:`архив, 1943`,f:`Launching radiosonde 1943.jpg`},wedge:{u:`4/4d/El_Reno_EF-5_Tornado_Wedge.jpg/500px-El_Reno_EF-5_Tornado_Wedge.jpg`,lic:`CC BY 2.0`,by:`Дэниел Родригес`,f:`El Reno EF-5 Tornado Wedge.jpg`},wedge2:{u:`7/77/1960_Newbury_Kansas_wedge.jpg/500px-1960_Newbury_Kansas_wedge.jpg`,lic:`общественное достояние`,by:`Дорожный патруль Канзаса`,f:`1960 Newbury Kansas wedge.jpg`},wedge3:{u:`6/68/2007_Greensburg%2C_KS_tornado_from_Highway_148.jpg/500px-2007_Greensburg%2C_KS_tornado_from_Highway_148.jpg`,lic:`CC BY-SA 4.0`,by:`Крейг Уэджес`,f:`2007 Greensburg, KS tornado from Highway 148.jpg`},cone:{u:`9/98/F5_tornado_Elie_Manitoba_2007.jpg/500px-F5_tornado_Elie_Manitoba_2007.jpg`,lic:`CC BY-SA 3.0`,by:`Джастин Хобсон`,f:`F5 tornado Elie Manitoba 2007.jpg`},cone2:{u:`c/cd/Ottawa%2C_KS_Tornado.jpg/500px-Ottawa%2C_KS_Tornado.jpg`,lic:`CC BY 4.0`,by:`Augustcm`,f:`Ottawa, KS Tornado.jpg`},cone3:{u:`8/86/Evolution_of_a_Tornado.jpg/500px-Evolution_of_a_Tornado.jpg`,lic:`CC BY-SA 4.0`,by:`Джейсон Уэйнгарт`,f:`Evolution of a Tornado.jpg`},rope2:{u:`5/55/Rope_Tornado_near_Yuma%2C_Colorado.jpg/500px-Rope_Tornado_near_Yuma%2C_Colorado.jpg`,lic:`CC BY-SA 4.0`,by:`Штефан Кляйн`,f:`Rope Tornado near Yuma, Colorado.jpg`},rope3:{u:`d/dd/Tornado_roping_out_near_Otis%2C_CO.jpg/500px-Tornado_roping_out_near_Otis%2C_CO.jpg`,lic:`CC0`,by:`BusyWikipedian`,f:`Tornado roping out near Otis, CO.jpg`},rope4:{u:`c/c4/Tornado_Rope_Out.jpg/500px-Tornado_Rope_Out.jpg`,lic:`CC BY 4.0`,by:`BusyWikipedian`,f:`Tornado Rope Out.jpg`},multi2:{u:`e/ea/1957_Dallas_multi-vortex_1_edited.JPG/500px-1957_Dallas_multi-vortex_1_edited.JPG`,lic:`общественное достояние`,by:`Роберт Дэй, Бюро погоды США`,f:`1957 Dallas multi-vortex 1 edited.JPG`},multi3:{u:`0/06/Tornado_near_Punkin_Center%2C_CO.jpg/500px-Tornado_near_Punkin_Center%2C_CO.jpg`,lic:`CC BY-SA 4.0`,by:`Штефан Кляйн`,f:`Tornado near Punkin Center, CO.jpg`},water2:{u:`8/80/Giant_water_spout_off_Florida_Keys_%28wea00341%29.jpg/500px-Giant_water_spout_off_Florida_Keys_%28wea00341%29.jpg`,lic:`общественное достояние`,by:`NOAA, Стив Никлас`,f:`Giant water spout off Florida Keys (wea00341).jpg`},water3:{u:`5/51/Waterspout_in_Key_West_Harbor_-_Key_West%2C_Florida_%283845000272%29.jpg/500px-Waterspout_in_Key_West_Harbor_-_Key_West%2C_Florida_%283845000272%29.jpg`,lic:`CC BY-SA 2.0`,by:`Cayobo`,f:`Waterspout in Key West Harbor - Key West, Florida (3845000272).jpg`},water4:{u:`f/fe/November_2000_Waterspout.jpg/500px-November_2000_Waterspout.jpg`,lic:`общественное достояние`,by:`NOAA`,f:`November 2000 Waterspout.jpg`},land2:{u:`2/24/Landspout_Tornado_near_Kirk%2C_CO.jpg/500px-Landspout_T
