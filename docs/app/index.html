Formentor%2C_Mallorca_2006-09-25.jpg`,lic:`CC BY 2.5`,by:`Julian Kupfer`,f:`Waterspout near Cap de Formentor, Mallorca 2006-09-25.jpg`},landspout:{u:`e/e0/Landspout_Tornado.jpg/500px-Landspout_Tornado.jpg`,lic:`CC BY-SA 4.0`,by:`Stefan Klein`,f:`Landspout Tornado.jpg`},funnel:{u:`9/92/Funnel_cloud_approaching_the_ground_-_NOAA.jpg/500px-Funnel_cloud_approaching_the_ground_-_NOAA.jpg`,lic:`общественное достояние`,by:`NOAA`,f:`Funnel cloud approaching the ground - NOAA.jpg`},dustdevil:{u:`4/43/Dust_devil.jpg/500px-Dust_devil.jpg`,lic:`общественное достояние`,by:`NASA`,f:`Dust devil.jpg`},firewhirl:{u:`2/29/Fire_whirl_%28FWS%29_crop.jpg/500px-Fire_whirl_%28FWS%29_crop.jpg`,lic:`общественное достояние`,by:`Служба рыбных ресурсов США`,f:`Fire whirl (FWS) crop.jpg`},gustnado:{u:`2/20/Gustnado_April26_2019.jpg/500px-Gustnado_April26_2019.jpg`,lic:`общественное достояние`,by:`NOAA`,f:`Gustnado April26 2019.jpg`},evolution:{u:`8/86/Evolution_of_a_Tornado.jpg/500px-Evolution_of_a_Tornado.jpg`,lic:`CC BY-SA 4.0`,by:`Jason Weingart`,f:`Evolution of a Tornado.jpg`},supercell:{u:`a/a5/Supercell_thunderstorm_over_Needmore%2C_Texas._May_4%2C_2019.jpg/500px-Supercell_thunderstorm_over_Needmore%2C_Texas._May_4%2C_2019.jpg`,lic:`CC BY-SA 4.0`,by:`Raychel Sanner`,f:`Supercell thunderstorm over Needmore, Texas. May 4, 2019.jpg`},wallcloud:{u:`8/8d/Well_Defined_Wall_Cloud.jpg/500px-Well_Defined_Wall_Cloud.jpg`,lic:`CC BY-SA 4.0`,by:`Stefan Klein`,f:`Well Defined Wall Cloud.jpg`},shelf:{u:`4/46/Riiulpilv_-_Shelf_cloud_%282%29_copy.jpg/500px-Riiulpilv_-_Shelf_cloud_%282%29_copy.jpg`,lic:`CC BY-SA 4.0`,by:`Kristian Pikner`,f:`Riiulpilv - Shelf cloud (2) copy.jpg`},mammatus:{u:`6/67/Hazy_mammatus_behind_wire.jpg/500px-Hazy_mammatus_behind_wire.jpg`,lic:`CC BY-SA 4.0`,by:`Rubbish computer`,f:`Hazy mammatus behind wire.jpg`},eye:{u:`a/a0/Hurricane_Isabel_eye_from_ISS_%28edit_1%29.jpg/500px-Hurricane_Isabel_eye_from_ISS_%28edit_1%29.jpg`,lic:`общественное достояние`,by:`Эд Лу, NASA, с МКС`,f:`Hurricane Isabel eye from ISS (edit 1).jpg`},mars:{u:`e/ea/Martian_Dust_Devil_Trails.jpg/500px-Martian_Dust_Devil_Trails.jpg`,lic:`общественное достояние`,by:`NASA/JPL, университет Аризоны`,f:`Martian Dust Devil Trails.jpg`}},co=[{id:`sticknet`,photo:`aws`,cat:`field`,name:`StickNet`,kind:`Переносная мачта, Техасский технологический`,tag:`48 штук за раз`,specs:[[`Меряет`,`скорость и направление ветра, давление, температуру, влажность`],[`Развёртывание`,`одна мачта — считанные минуты, силами двух человек`],[`Питание`,`автономное, на всё время шторма`],[`Разработчик`,`Национальный институт ветра, Техас`]],why:`Ровно то, что называется «свой зонд», только доведённое до серии. Мачту ставят на пути урагана и уезжают. В 2020 году в Лору выставили 48 штук, и 16 из них попали в стену глаза или сам глаз — благодаря этому Лора стала самым подробно задокументированным ураганом, вышедшим на побережье США.`,caveat:`Ставится заранее и вслепую: прогноз траектории на несколько часов вперёд решает, попадёт прибор в шторм или простоит зря. Ближе к берегу точнее, но там его сносит штормовым нагоном.`,url:`https://www.depts.ttu.edu/nwi/`},{id:`tiv`,photo:`tiv`,cat:`field`,name:`Tornado Intercept Vehicle`,kind:`Бронированная машина-перехватчик`,tag:`внутрь смерча`,specs:[[`Масса`,`около 6.5 т в исполнении TIV 2`],[`Защита`,`стальная броня, поликарбонатные стёкла`],[`Удержание`,`гидравлические упоры в грунт и сброс клиренса`],[`Создатель`,`Шон Кэйси`]],why:`Построена ради одного кадра: снять смерч изнутри. Упоры вбиваются в землю, машина садится на грунт и превращается в якорь. В 2009 году TIV 2 действительно оказалась внутри воронки и вернулась.`,caveat:`Это киносъёмочная и рекордная машина, а не научный прибор. Данных она даёт немного, риск огромен, и повторять такое без подготовки — верный способ погибнуть.`,url:`https://en.wikipedia.org/wiki/Tornado_Intercept_Vehicle`},{id:`dow`,photo:`dow`,cat:`field`,name:`Doppler on Wheels`,kind:`Мобильный доплеровский радар`,tag:`рекорд 484 км/ч`,specs:[[`Разрешение`,`десятки метров на дистанции в километры`],[`Развёртывание`,`минуты, прямо с обочины`],[`Диапазоны`,`X и Ka`],[`Проекты`,`VORTEX2, TORUS, PECAN`]],why:`Радар на грузовике, который подъезжает к смерчу на километры и просвечивает его насквозь. Именно DOW измерил 484 км/ч в Бридж-Крик — самую высокую скорость ветра у поверхности Земли за всю историю. Всё, что известно о внутренней структуре смерчей, добыто такими машинами.`,caveat:`Радар меряет скорость не у земли, а на высоте луча — десятки метров и выше. Поэтому его рекорды не идут в рейтинг EF: категорию дают по разрушениям на грунте.`,url:`https://www.flexibleobservingfacility.org/`},{id:`mesonet`,photo:`mesonet`,cat:`field`,name:`Mobile Mesonet`,kind:`Метеостанция на крыше автомобиля`,tag:`сеть на колёсах`,specs:[[`Меряет`,`ветер, температуру, влажность, давление на ходу`],[`Высота мачты`,`около 3.5 м над дорогой`],[`Особенность`,`поправка на собственную скорость машины`]],why:`Самый доступный способ собрать поле данных вокруг грозы: несколько машин расходятся веером и пишут разрез через фронт порывов. Из этих разрезов и выяснили, что нисходящий поток с тыла — ключ к рождению смерча.`,caveat:`Ветер на крыше едущей машины искажён её собственным потоком; поправки обязательны, и без них данные хуже, чем никакие.`,url:`https://www.nssl.noaa.gov/`},{id:`sonde`,photo:`sonde`,cat:`field`,name:`Радиозонд`,kind:`Шар-зонд с передатчиком`,tag:`дважды в сутки, весь мир`,specs:[[`Меряет`,`давление, температуру, влажность, ветер по сносу`],[`Высота`,`до 30–35 км, пока шар не лопнет`],[`Запуск`,`00 и 12 UTC одновременно по всей планете`]],why:`Единственный способ узнать, что происходит в атмосфере по высоте, а не у земли. Именно по радиозондам считают энергию неустойчивости, от которой зависит, будет ли смерч. Мировая сеть запускает их синхронно с 1930-х годов — это самая старая работающая система глобальных наблюдений.`,caveat:`Одна точка дважды в сутки. Между запусками атмосфера успевает измениться полностью, и всё, что происходит в промежутке, остаётся за кадром.`,url:`https://www.weather.gov/upperair/factsheet`},{id:`hunters`,photo:`hunters`,cat:`field`,name:`Охотники за ураганами`,kind:`Самолёт и сбрасываемые зонды`,tag:`внутрь глаза`,specs:[[`Самолёты`,`WC-130J ВВС США, WP-3D и Gulfstream IV у NOAA`],[`Метод`,`полёт сквозь стену глаза, сброс зондов вниз`],[`Дропсонд`,`передаёт профиль всю дорогу до воды`]],why:`Спутник видит ураган сверху и не знает давления в его центре, а прогноз силы зависит именно от него. Единственный способ узнать — влететь внутрь и сбросить зонд. Эти полёты заметно уточняют прогноз траектории, и потому их продолжают несмотря на риск.`,caveat:`Дорого, опасно и только для тропических циклонов: внутрь смерча самолёт не влетит — он слишком мал и слишком быстр.`,url:`https://www.aoml.noaa.gov/hurricane-research-division/`},{id:`nexrad`,photo:`nexrad`,cat:`field`,name:`NEXRAD`,kind:`Стационарный доплеровский радар`,tag:`159 штук на США`,specs:[[`Дальность`,`до 230 км по осадкам`],[`Обновление`,`полный объём за 4–6 минут`],[`Поляризация`,`двойная — различает дождь, град и обломки`]],why:`Сеть, на которой держится вся система предупреждений. Двойная поляризация умеет то, ради чего её и вводили: отличить обломки, поднятые смерчем, от осадков. Такая отметка означает, что смерч уже на земле и что-то ломает, — даже если никто его не видит.`,caveat:`Луч уходит вверх с расстоянием: в 150 км от радара он идёт уже на трёх километрах и происходящего у земли не видит вовсе. Отсюда дыры в покрытии между станциями.`,url:`https://www.roc.noaa.gov/`}],lo=[{id:`supercell`,photo:`supercell`,cat:`birth`,photos:[`supercell`,`super2`,`super3`,`super4`],name:`Суперячейка`,kind:`Гроза с вращающимся восходящим потоком`,tag:`мать смерчей`,specs:[[`Размер мезоциклона`,`2–10 км в поперечнике`],[`Живёт`,`часами, в отличие от обычной грозы`],[`Даёт смерч`,`меньше чем в одном случае из пяти`]],why:`Единственный тип грозы, живущий часами: её восходящий поток вращается, и потому осадки выпадают в стороне, а не гасят его. Почти все сильные смерчи рождаются именно здесь. Вращение приходит из сдвига ветра по высоте — ветер у земли и на трёх километрах дует по-разному, и этот перепад ставит воздух на бок, а восходящий поток поднимает ось вращения вертикально.`,caveat:`Суперячейка не равна смерчу. Большинство их не даёт вовсе — что именно решает исход, до конца не выяснено до сих пор.`,url:`https://www.nssl.noaa.gov/education/svrwx101/thunderstorms/types/`},{id:`wallcloud`,photo:`wallcloud`,cat:`birth`,photos:[`wallcloud`,`wall2`,`wall3`],name:`Стена облаков`,kind:`Опущенное основание под восходящим потоком`,tag:`смотреть сюда`,specs:[[`Где`,`под самым мощным восходящим потоком, у зоны осадков`],[`Признак опасности`,`вращается и поднимается`],[`Что дальше`,`из неё и опускается воронка`]],why:`Кусок основания грозы, опущенный ниже остального: влажный воздух из зоны осадков втягивается в поток и конденсируется раньше. Если стена вращается на глазах и поднимается — это и есть предвестник смерча, самый надёжный из видимых.`,caveat:`Не всякая опущенность — стена облаков, и не всякая стена вращается. Ключ именно во вращении и в подъёме, а не в том, что «что-то висит ниже».`,url:`https://www.weather.gov/safety/tornado-during`},{id:`funnel`,photo:`funnel`,cat:`birth`,photos:[`funnel`,`funn2`,`funn3`,`funn4`],name:`Воронка без касания`,kind:`Funnel cloud`,tag:`ещё не смерч`,specs:[[`Что видно`,`конденсационный конус, не дошедший до земли`],[`Статус`,`смерчем считается только при циркуляции у грунта`],[`Опасность`,`может опуститься за секунды`]],why:`Формально это ещё не смерч: категорию и само название даёт контакт с землёй, а точнее — вихрь у грунта, поднимающий пыль. Различие не бюрократическое: именно у земли ветер и ломает.`,caveat:`Обратное тоже верно и опаснее: смерч может уже работать, а конденсационной воронки не быть — если воздух сухой, видно будет только пыльный вихрь внизу.`,url:`https://www.weather.gov/safety/tornado`},{id:`wedge`,photo:`wedge`,cat:`kind`,photos:[`wedge`,`wedge2`,`wedge3`],name:`Клиновидный`,kind:`Wedge`,tag:`шире, чем выше`,specs:[[`Признак`,`видимая ширина больше видимой высоты`],[`Обычно`,`самые разрушительные, но не по определению`],[`Пример`,`Эли, Манитоба, 2007 — единственный F5 в Канаде`]],why:`Не отдельный вид, а описание облика: воронка выглядит шире, чем высота от земли до облака. Такие чаще оказываются сильными просто потому, что широкий смерч дольше держится и охватывает больше.`,caveat:`Ширина не равна силе. Эль-Рино 2013 был шире всех в истории — 4.2 км — и получил всего EF3, потому что шёл по пустой местности, а категорию дают по разрушениям.`,url:`https://www.spc.noaa.gov/faq/tornado/`},{id:`cone`,photo:`cone`,cat:`kind`,photos:[`cone`,`cone2`,`cone3`],name:`Конусовидный`,kind:`Cone`,tag:`тот самый облик`,specs:[[`Признак`,`высота заметно больше ширины, книзу сужается`],[`Встречается`,`чаще любого другого облика`],[`Пример`,`Эли, Манитоба, 2007 — единственный F5 в Канаде`]],why:`То, что рисуют, когда говорят «смерч»: воронка сужается от облака к земле и вытянута по высоте. Самый обычный облик и самый узнаваемый — именно из-за него клин так часто путают с конусом, хотя клин ровно наоборот шире, чем выше.`,caveat:`Облик меняется по ходу жизни одного и того же смерча: конус может расшириться в клин, а к концу вытянуться в верёвку. Это не разные виды, а стадии.`,url:`https://www.spc.noaa.gov/faq/tornado/`},{id:`rope`,photo:`rope`,cat:`kind`,photos:[`rope`,`rope2`,`rope3`,`rope4`],name:`Верёвочный`,kind:`Rope`,tag:`стадия, а не вид`,specs:[[`Когда`,`обычно последняя фаза жизни смерча`],[`Облик`,`тонкий извивающийся жгут`],[`Опасность`,`остаётся высокой до самого конца`]],why:`Так смерч чаще всего умирает: воронка вытягивается, изгибается и рвётся. Красивая и обманчивая стадия.`,caveat:`Тонкий — не значит слабый. На стадии верёвки вихрь сжимается, и по закону сохранения момента импульса скорость может даже вырасти. Смерчи убивали людей именно в этой фазе.`,url:`https://www.spc.noaa.gov/faq/tornado/`},{id:`multi`,photo:`multi`,cat:`kind`,photos:[`multi`,`multi2`,`multi3`],name:`Многовихревой`,kind:`Multiple-vortex`,tag:`вихри внутри вихря`,specs:[[`Устройство`,`2–6 малых вихрей вокруг общего центра`],[`Скорость`,`в субвихре заметно выше, чем в основном`],[`След`,`полосы разрушений внутри общей полосы`]],why:`Объясняет старую загадку: почему один дом снесён до фундамента, а соседний цел. Внутри воронки бегают несколько маленьких вихрей, и скорость в них складывается со скоростью вращения всей системы. Через дом мог пройти субвихрь, а через соседний — нет.`,caveat:`Разглядеть субвихри удаётся редко: их видно только когда воронка хорошо освещена и не залита дождём.`,url:`https://www.nssl.noaa.gov/education/svrwx101/tornadoes/`},{id:`waterspout`,photo:`waterspout`,cat:`kind`,photos:[`waterspout`,`water2`,`water3`,`water4`],name:`Водяной смерч`,kind:`Waterspout`,tag:`их два разных`,specs:[[`Погожий тип`,`растёт снизу вверх от развивающегося облака, обычно слабый`],[`Смерчевой тип`,`обычный смерч, вышедший на воду, опасен так же`],[`Где часто`,`Флорида-Кис, Адриатика, Великие озёра`]],why:`Под одним названием прячутся два разных явления. Погожий развивается на границе воды и растёт вверх, живёт минуты и редко опасен. Смерчевой — это полноценный смерч суперячейки, которому просто случилось оказаться над водой.`,caveat:`Издалека они неразличимы. Выходя на берег, погожий обычно распадается, а смерчевой не меняется вовсе.`,url:`https://www.weather.gov/key/marine_waterspouts`},{id:`landspout`,photo:`landspout`,cat:`kind`,photos:[`landspout`,`land2`,`land3`,`land4`],name:`Ландспаут`,kind:`Landspout`,tag:`без мезоциклона`,specs:[[`Рождается`,`от приземной границы, а не от вращения в облаке`],[`Сила`,`обычно EF0–EF1`],[`На радаре`,`подписи почти нет`]],why:`Сухопутный близнец погожего водяного смерча: вращение берётся у земли, на линии сходимости, а растущее облако его вытягивает вверх. Формально это настоящий смерч, и его считают в статистике.`,caveat:`Опаснее, чем кажется, именно из-за радара: мезоциклона нет, крюка нет, предупреждение часто не выпускается — а вихрь есть.`,url:`https://www.nssl.noaa.gov/education/svrwx101/tornadoes/types/`},{id:`gustnado`,photo:`gustnado`,cat:`false`,photos:[`gustnado`,`gust2`,`gust3`,`gust4`],name:`Гастнадо`,kind:`Вихрь на фронте порывов`,tag:`не смерч`,specs:[[`Где`,`на переднем крае холодного выброса из грозы`],[`Связь с облаком`,`отсутствует — и это решающий признак`],[`Живёт`,`секунды, реже минуту`]],why:`Пыльный вихрь, который крутится на линии шквала. Выглядит убедительно, попадает в новости как смерч, но смерчем не является: он не связан с основанием облака, а это в определении главное.`,caveat:`Безобидным его тоже не назовёшь: скорости бывают как у слабого смерча, и лёгкие постройки он повреждает.`,url:`https://www.nssl.noaa.gov/education/svrwx101/tornadoes/types/`},{id:`dustdevil`,photo:`dustdevil`,cat:`false`,photos:[`dustdevil`,`dust2`,`dust3`,`dust4`],name:`Пыльный вихрь`,kind:`Dust devil`,tag:`ясное небо`,specs:[[`Когда`,`в жару и в ясную погоду`],[`Причина`,`перегретая поверхность, а не гроза`],[`Высота`,`обычно десятки метров`]],why:`Возникает от нагрева земли: поднимающийся воздух закручивается и подхватывает пыль. Облака для этого не нужно вовсе — потому это и не смерч.`,caveat:`На Марсе они достигают километров в высоту и оставляют тёмные следы, видимые с орбиты. Марсоходам они не раз чистили солнечные панели и продлевали работу на годы дольше расчётного срока.`,url:`https://www.nssl.noaa.gov/education/svrwx101/tornadoes/types/`},{id:`firewhirl`,photo:`firewhirl`,cat:`false`,photos:[`firewhirl`,`fire2`,`fire3`,`fire4`],name:`Огненный вихрь`,kind:`Fire whirl`,tag:`редкое исключение`,specs:[[`Причина`,`тепло пожара, а не грозовое облако`],[`Обычно`,`десятки метров, минуты жизни`],[`Исключение`,`Канберра, 2003 — оценён как F3`]],why:`Пожар создаёт собственный восходящий поток такой силы, что тот закручивается. В большинстве случаев это явление масштаба пыльного вихря.`,caveat:`Но не всегда: в Канберре в 2003 году огненный вихрь получил рейтинг F3, то есть был настоящим смерчем, порождённым пожаром. Такие случаи единичны.`,url:`https://www.nssl.noaa.gov/education/svrwx101/tornadoes/types/`},{id:`shelf`,photo:`shelf`,cat:`false`,photos:[`shelf`,`shelf2`,`shelf3`,`shelf4`],name:`Шельфовое облако`,kind:`Shelf cloud`,tag:`путают чаще всего`,specs:[[`Что это`,`передний край холодного выброса грозы`],[`Движение`,`не вращается, а надвигается стеной`],[`Что следом`,`резкий порыв и ливень`]],why:`Выглядит устрашающе и вызывает больше ложных тревог, чем всё остальное вместе. Но это противоположность стены облаков: там воздух втягивается внутрь грозы, здесь — выбрасывается наружу.`,caveat:`Отличать просто: шельфовое надвигается ровной стеной и не вращается, стена облаков висит на месте и крутится. Первое означает шквал, второе — возможный смерч.`,url:`https://www.weather.gov/mkx/taw-shelf_cloud`},{id:`mammatus`,photo:`mammatus`,cat:`false`,photos:[`mammatus`,`mamm2`,`mamm3`,`mamm4`],name:`Вымеобразные облака`,kind:`Mammatus`,tag:`красиво, но не про опасность`,specs:[[`Где`,`под наковальней мощной грозы`],[`Причина`,`опускающийся холодный воздух с осадками`],[`Означает`,`гроза сильная — но обычно уже уходит`]],why:`Мешковидные наросты под наковальней. Признак того, что гроза мощная, и один из красивейших видов неба.`,caveat:`Опасности под собой они не означают: чаще всего появляются с тыльной стороны уходящей грозы, а не там, где что-то произойдёт.`,url:`https://www.weather.gov/`},{id:`eye`,photo:`eye`,cat:`big`,photos:[`eye`,`eye2`,`eye3`,`eye4`],name:`Глаз урагана`,kind:`Тропический циклон`,tag:`затишье в центре`,specs:[[`Диаметр глаза`,`обычно 30–60 км`],[`В глазу`,`почти штиль и часто чистое небо`],[`Стена глаза`,`самый сильный ветер всей системы`]],why:`Воздух в центре опускается, поэтому облака там разрушаются и наступает затишье — иногда с солнцем над головой. Снимок сделан с МКС: сверху видно, что глаз это настоящий колодец в облачной стене.`,caveat:`Затишье обманывает: после прохода глаза ветер возвращается с той же силой, но с противоположной стороны. Люди выходят наружу в затишье и попадают под вторую половину — это классическая причина гибели.`,url:`https://www.nhc.noaa.gov/`},{id:`mars`,photo:`mars`,cat:`big`,photos:[`mars`,`mars2`,`mars3`],name:`Вихри на Марсе`,kind:`Пыльные вихри другой планеты`,tag:`любопытное`,specs:[[`Высота`,`до 8 км — выше земных в сотни раз`],[`Видно`,`тёмные следы на поверхности с орбиты`],[`Польза`,`сдувают пыль с солнечных панелей марсоходов`]],why:`Атмосфера Марса в сто раз разрежённее земной, но вихри там крупнее наших: слабое притяжение и сильный прогрев поверхности дают им расти километрами. Следы, которые они оставляют, различимы со спутника.`,caveat:`Марсоходы Spirit и Opportunity были рассчитаны на 90 суток, а проработали годы — во многом потому, что вихри время от времени чистили им панели. Единственный известный случай, когда погода чужой планеты продлила жизнь технике.`,url:`https://science.nasa.gov/mars/`}],uo=[{id:`birth`,label:`Как рождается`},{id:`kind`,label:`Виды смерчей`},{id:`false`,label:`Похожее, но не то`},{id:`big`,label:`Большие вихри`}],fo=[{id:`sensors`,label:`Рекомендуемые датчики`},{id:`probe`,label:`Свой зонд`},{id:`storm`,label:`Смерчи и ураганы`}],po=`Я пользуюсь самодельной метеостанцией MyWindProbe: ESP32 с анемометром, дашборд на React вшит в прошивку и раздаётся самой платой. Вкладки: Основное, Метеорология, Радар (круговой обзор, конвективный профиль, роза ветров, шкала Бофорта, карта мира, эфир), Район, Анализ (занятия, статистика, прогноз), Станция, Настройки. Вопрос: `,mo=[`Как подключить датчик BME280 к моей станции и что для этого поменять в прошивке?`,`Где в дашборде посмотреть порывы и как сбросить накопленный максимум?`,`Что означает конвективный профиль и как понять, что подходит шквал?`,`Какой анемометр выбрать вместо нынешнего, чтобы видеть слабый ветер?`,`Как подключиться к станции с телефона, если она раз         .th-liquid .dock-open .dock-gear {
          background: radial-gradient(120% 90% at 50% 0%, rgba(255,255,255,0.4), rgba(255,255,255,0) 62%),
                      radial-gradient(90% 90% at 50% 100%, rgba(125,211,252,0.28), rgba(125,211,252,0) 70%),
                      linear-gradient(180deg, rgba(255,255,255,0.22), rgba(255,255,255,0.08)) !important;
          box-shadow: inset 0 1px 0.5px rgba(255,255,255,0.8), inset 0 -1px 0.5px rgba(160,220,255,0.4),
                      inset 0 0 14px rgba(125,211,252,0.18), 0 0 0 0.5px rgba(0,0,0,0.35),
                      0 0 18px -4px rgba(125,211,252,0.45) !important }
        /* Ноутбук и компьютер: вкладки дока крупнее — на телефоне они и так
           на всю ширину. Шрифт задан у кнопки инлайном, отсюда !important. */
        @media (min-width: 561px) {
          .app .dock-row { --bar-h: 66px }
          .th-liquid nav .dock-tabs > button, .dock-tabs > button {
            padding: 12px 20px !important; font-size: 11.5px !important; gap: 10px !important }
          .dock-tabs > button .tab-ic { width: 22px; height: 22px }
          .dock-gear { width: 46px; height: 46px }
          .dock-gear svg { width: 22px; height: 22px }
        }
        .gear-btn {
          position: fixed; right: 18px; bottom: 18px; z-index: 90;
          width: 48px; height: 48px; border-radius: 50%; cursor: pointer; padding: 0;
          display: flex; align-items: center; justify-content: center;
          color: rgba(240,246,252,0.92);
          border: 1px solid var(--pnl-line); background: var(--pnl-bg); box-shadow: var(--pnl-shadow);
          -webkit-backdrop-filter: blur(16px) saturate(1.5); backdrop-filter: blur(16px) saturate(1.5);
          transition: transform .35s cubic-bezier(.2,.9,.25,1.2), color .2s;
        }
        .gear-btn:active { transform: scale(.92) }
        .gear-btn:hover { transform: rotate(60deg) scale(1.06); color: #fff; }
        .set-scrim { position: fixed; inset: 0; z-index: 89; background: rgba(0,0,0,0.18); animation: setFade .3s ease both }
        .set-scrim.set-scrim-out { animation: setFadeOut .6s ease forwards; pointer-events: none }
        @keyframes setFadeOut { from { opacity: 1 } to { opacity: 0 } }
        @keyframes setPop { from { opacity: 0; transform: translateY(18px) scale(.92) } to { opacity: 1; transform: none } }
        @keyframes setFade { from { opacity: 0 } to { opacity: 1 } }
        .set-x { background: none; border: 0; color: rgba(231,238,246,0.6); cursor: pointer; font-size: 13px; }
        /* «More soon» рядом с единственной темой: пунктирная пилюля с бегущим
           бликом — место под будущую тему, а не кнопка. */
        @keyframes moreSoon { from { background-position: 180% 0 } to { background-position: -80% 0 } }
        .more-soon {
          font-family: var(--ui-mono); font-size: 9.5px; letter-spacing: 1.2px;
          padding: 5px 11px; border-radius: 999px; border: 1px dashed rgba(231,238,246,0.22);
          color: transparent; -webkit-background-clip: text; background-clip: text;
          background-image: linear-gradient(100deg, rgba(231,238,246,0.38) 35%,
                            rgba(231,238,246,0.95) 50%, rgba(231,238,246,0.38) 65%);
          background-size: 250% 100%; animation: moreSoon 3.2s linear infinite;
          user-select: none;
        }
        .mo-off .more-soon { animation: none; color: rgba(231,238,246,0.45); background: none }

        /* ---------- запуск ---------- */
        @keyframes bootIn   { from { opacity: 0 } to { opacity: 1 } }
        @keyframes bootOut  { to { opacity: 0; transform: scale(1.06) } }
        @keyframes bootArc  { to { stroke-dashoffset: 0 } }
        @keyframes bootSpin { to { transform: rotate(360deg) } }
        @keyframes bootBar  { from { transform: scaleX(0) } to { transform: scaleX(1) } }
        @keyframes bootName { from { opacity: 0; letter-spacing: 16px }
                              to   { opacity: 1; letter-spacing: 5px } }
        .boot {
          position: fixed; inset: 0; z-index: 900;
          display: flex; flex-direction: column; align-items: center; justify-content: center;
          gap: 18px; background: var(--ui-bg, #04070a);
          animation: bootIn .2s ease both, bootOut .5s ease-in 3.35s both;
        }
        .boot-mark { animation: bootSpin 2.4s linear infinite; transform-origin: 50% 50% }
        .boot-arc  { animation: bootArc 3s cubic-bezier(.45,.05,.2,1) both }
        .boot-dot  { animation: bootIn .6s ease .6s both }
        .boot-name { font-family: var(--ui-mono); font-size: 13px; color: #e7eef6;
                     animation: bootName 1.6s var(--ease-out) .35s both }
        .boot-bar  { width: 190px; height: 2px; background: rgba(160,180,200,0.18) }
        .boot-bar i { display: block; height: 100%; background: #e7eef6;
                      transform-origin: 0 50%;
                      animation: bootBar 3.1s cubic-bezier(.45,.05,.2,1) both }
        .boot-note { font-family: var(--ui-mono); font-size: 9.5px; letter-spacing: 2px;
                     color: rgba(231,238,246,0.46); text-transform: uppercase;
                     animation: bootIn 1.2s ease 1.1s both }

        /* ---------- ожидание ---------- */
        /* Мерцание вместо крутящегося кружка: кружок одинаков и на полсекунды,
           и на полминуты, а бегущий по блоку блик показывает, что чего-то ждут
           именно здесь, на месте будущего содержимого. */
        @keyframes shimmer { from { background-position: -160% 0 } to { background-position: 260% 0 } }
        .shimmer {
          background-image: linear-gradient(100deg,
            rgba(231,238,246,0.03) 30%, rgba(231,238,246,0.11) 48%, rgba(231,238,246,0.03) 66%);
          background-size: 220% 100%;
          animation: shimmer 2.4s linear infinite;
        }
        @keyframes waitBar { 0% { transform: translateX(-100%) } 100% { transform: translateX(320%) } }
        .wait-bar { position: relative; height: 2px; overflow: hidden;
                    background: rgba(160,180,200,0.14) }
        .wait-bar i { position: absolute; inset: 0 auto 0 0; width: 32%;
                      background: currentColor; animation: waitBar 1.9s var(--ease-out) infinite }

        /* Подложка задаётся переменной во всех трёх местах сразу: инлайновый
           фон корневого div перекрыл бы выбор, а прозрачный body показал бы
           фон хоста. */
        body, html { background: var(--ui-bg, #04070a); margin: 0 }
        /* Подложка кастомизации ложится слоями на body. Когда она есть,
           корневые обёртки обязаны стать прозрачными — иначе своя заливка
           перекрыла бы её целиком и выбор не дал бы никакого эффекта. */
        body { ${Xr} }
        #root, .app { background: ${Xr?`transparent`:`var(--ui-bg, #04070a)`} }
        button:focus-visible, input:focus-visible { outline: 1px solid rgba(231,238,246,0.6); outline-offset: 1px; }

        @keyframes pulse   { 0%, 100% { opacity: 1 } 50% { opacity: 0.25 } }
        @keyframes ledBlink{ 0%, 49% { filter: none } 50%, 100% { filter: brightness(0.3) } }
        /* Развёртка кругового обзора. transform-origin задан инлайном в SVG:
           у вложенных <g> проценты считаются от bbox, а не от вьюбокса. */
        @keyframes ppiSweep{ to { transform: rotate(360deg) } }
        @keyframes echoPing{ 0% { r: 3; opacity: .75 } 100% { r: 15; opacity: 0 } }
        @keyframes vortex  { to { transform: rotate(-360deg) } }
        @keyframes rise {
          0%   { opacity: 0; transform: translateY(30px) scale(.95) }
          62%  { opacity: 1; transform: translateY(-5px) scale(1.008) }
          100% { opacity: 1; transform: none }
        }
        /* Курсор подсказчика мигает как в восьмибитных играх — жёсткими шагами,
           без плавного затухания: плавность выдаёт CSS и убивает весь эффект. */
        @keyframes caretBlink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }
        .tutor-caret { animation: caretBlink 1s steps(1) infinite }

        /* Перегрузка шкалы. Второй круг дышит, кольца частиц вокруг него
           крутятся в разные стороны — так движение читается вихрем, а не
           вращением одной шестерёнки. */
        @keyframes overPulse { 0%, 100% { opacity: 1 } 50% { opacity: .55 } }
        @keyframes orbitCW  { to { transform: rotate(360deg) } }
        @keyframes orbitCCW { to { transform: rotate(-360deg) } }
        .over-pulse { animation: overPulse 1.6s ease-in-out infinite }
        .orbit-cw   { animation: orbitCW 2.4s linear infinite }
        .orbit-ccw  { animation: orbitCCW 2.4s linear infinite }

        /* Частицы по экрану летят справа налево со сносом по вертикали.
           Только transform и opacity — свойства, которые браузер считает
           на видеокарте, не трогая вёрстку. */
        @keyframes stormFly {
          from { transform: translate3d(102vw, 0, 0) scale(1); opacity: 0 }
          8%   { opacity: .9 }
          88%  { opacity: .9 }
          to   { transform: translate3d(-6vw, var(--drift, 0), 0) scale(.6); opacity: 0 }
        }
        .storm-bit {
          position: absolute; left: 0; border-radius: 50%;
          will-change: transform, opacity;
          animation: stormFly 2s linear infinite;
        }

        /* Тревога добралась до самой шкалы: пульсирует число и кольцо.
           Не мигание в ноль, а именно пульс — резкое исчезновение цифры
           мешало бы её прочитать, а прочитать её в этот момент важнее всего. */
        @keyframes speedAlarm { 0%, 100% { opacity: 1 } 50% { opacity: .45 } }
        .speed-alarm { animation: speedAlarm 1.9s ease-in-out infinite }

        /* Винт Young 05103. Вращение задаётся длительностью из JS —
           она обратно пропорциональна скорости ветра. */
        @keyframes youngSpin { to { transform: rotate(360deg) } }
        .young-spin { animation: youngSpin 1.8s linear infinite; transform-box: view-box }

        /* Воронка качается целиком, обломки летают по орбите вокруг неё. */
        @keyframes tornadoSway {
          0%, 100% { transform: rotate(-2.2deg) }
          50%      { transform: rotate(2.2deg) }
        }
        @keyframes debrisOrbit {
          from { transform: rotate(0deg) translateX(var(--orbit, 20px)) scaleX(1) }
          50%  { transform: rotate(180deg) translateX(var(--orbit, 20px)) scaleX(.35) }
          to   { transform: rotate(360deg) translateX(var(--orbit, 20px)) scaleX(1) }
        }
        @keyframes recBlink { 0%, 55% { opacity: 1 } 56%, 100% { opacity: .15 } }
        /* Полосы конденсации бегут по воронке — так глаз считывает вращение.
           Бегущий штрих вместо пересчёта геометрии: ноль работы на кадр. */
        @keyframes funnelBand { to { stroke-dashoffset: -40 } }
        /* Молния редкая и короткая, как в жизни: две вспышки за двенадцать
           секунд. Постоянно сверкающая гроза выглядит гирляндой. */
        @keyframes lightning {
          0%, 5.6%, 100% { opacity: 0 }
          5.8% { opacity: 1 } 6.4% { opacity: .15 } 6.9% { opacity: .9 } 7.6% { opacity: 0 }
        }
        .funnel-band { animation: funnelBand 3s linear infinite }
        .lightning { animation: lightning 12s linear infinite; opacity: 0 }
        /* Ночью воронку выхватывает только вспышка. Кадры те же, что у молнии,
           поэтому подсветка синхронна с ней сама собой — без единой строки JS. */
        @keyframes flashLit {
          0%, 5.6%, 100% { opacity: .06 }
          5.8% { opacity: .95 } 6.4% { opacity: .3 } 6.9% { opacity: .85 } 7.6% { opacity: .06 }
        }
        .flash-lit { animation: flashLit 12s linear infinite }
        .tornado-sway { animation: tornadoSway 7s ease-in-out infinite; transform-box: view-box }
        .tornado-debris { animation: debrisOrbit 3.4s linear infinite; transform-box: view-box }
        .rec-blink { animation: recBlink 1.6s steps(1) infinite }

        /* Блок сетки и панель внутри него. Высота у блока задана человеком,
           поэтому панель обязана занять её целиком, а её тело — стать
           колонкой: только тогда прибор внутри может растянуться на остаток.
           Правило нарочно привязано к .blk — вне сетки (радар, окна, другие
           вкладки) высота по-прежнему от содержимого. */
        .blk { min-width: 0; min-height: 0 }
        .blk > *, .blk .pnl { height: 100% }
        .pnl { display: flex; flex-direction: column }
        .pnl > div:last-child { display: flex; flex-direction: column; min-height: 0 }
        .blk .pnl > div:last-child { flex: 1 1 auto; overflow: auto }
        /* Полоса прокрутки внутри панели — тонкая и без стрелок: панель это
           прибор, а не документ. */
        .blk .pnl > div:last-child::-webkit-scrollbar { width: 6px; height: 6px }
        .blk .pnl > div:last-child::-webkit-scrollbar-thumb {
          background: rgba(160,180,200,0.25) }

        /* Плотность, рамки и контраст — классами на корне, чтобы не тащить
           их пропсами в каждый компонент. */
        .dens-compact .pnl > div { padding: 8px 9px }
        .dens-compact .pnl > header { padding: 6px 9px 5px }
        /* Раньше это правило пыталось перебить инлайновый border панели и
           проигрывало — настройка молча ничего не делала. Теперь и рамка, и
           фон живут в переменных, и снять их достаточно один раз. */
        .noborders { --pnl-line: transparent; --pnl-bg: none; --pnl-shadow: none;
                     --pnl-head-line: rgba(160,180,200,0.12) }

        /* Ползунки демо-режима. Родной вид input[type=range] выбивается из
           приборной панели сильнее всего остального, поэтому он собран заново:
           тонкая линейка и квадратная ручка, без скруглений и объёма. */
        .rng { -webkit-appearance: none; appearance: none; width: 100%; height: 16px;
               background: transparent; cursor: pointer; display: block }
        .rng::-webkit-slider-runnable-track { height: 2px; background: rgba(160,180,200,0.28) }
        .rng::-moz-range-track { height: 2px; background: rgba(160,180,200,0.28) }
        .rng::-webkit-slider-thumb { -webkit-appearance: none; appearance: none;
               width: 10px; height: 14px; margin-top: -6px; border: none;
               background: var(--rng-accent, #e7eef6); transition: transform .12s ease }
        .rng::-moz-range-thumb { width: 10px; height: 14px; border: none; border-radius: 0;
               background: var(--rng-accent, #e7eef6) }
        .rng:active::-webkit-slider-thumb { transform: scaleY(1.25) }
        .rng:focus-visible { outline: 1px solid rgba(231,238,246,0.6); outline-offset: 3px }

        /* Тревога дышит рамкой, а не мигает целиком: мигающий блок в углу
           экрана раздражает и его начинают игнорировать. */
        @keyframes alarmPulse {
          0%, 100% { box-shadow: 0 0 0 rgba(239,68,68,0) }
          50%      { box-shadow: 0 0 16px rgba(239,68,68,0.35) }
        }
        .alarm-hot { animation: alarmPulse 3s ease-in-out infinite }

        /* Переходы. Раньше двигались только панели при появлении, и от этого
           смена вкладки выглядела как подмена картинки. Теперь у содержимого
           есть вход, у подвкладок — своя, более короткая версия, а у строк
           списка — собственная: список станций иначе прыгает при удалении. */
/* Кривая с перелётом: значение переваливает за единицу и возвращается.
           Именно она отличает «съехало» от «прилетело и встало» — без неё
           движение читается как перерисовка, сколько его ни удлиняй. */
        @keyframes tabfade {
          from { opacity: 0; transform: translateY(26px) scale(.965) }
          to   { opacity: 1; transform: none }
        }
        @keyframes rowin {
          from { opacity: 0; transform: translateX(-22px) }
          to   { opacity: 1; transform: none }
        }
        .tabfade { animation: tabfade .62s var(--ease-out) both }
        .rowin   { animation: rowin .44s var(--ease-out) both }

        /* Полоса вкладок: под выбранной проезжает подчёркивание, а не просто
           меняется цвет. Движение показывает, откуда и куда переключились. */
        @keyframes tabmark { from { transform: scaleX(0); opacity: 0 } to { transform: scaleX(1); opacity: 1 } }
        .tab-mark { animation: tabmark .5s var(--ease-out) both; transform-origin: 50% 50% }
        /* Растр отражаемости проявляется, а не выскакивает: подмена готового
           кадра иначе читается как мигание. */
        @keyframes radarFade { from { opacity: 0 } to { opacity: .78 } }
        .radar-fade { animation: radarFade .9s ease-out both }

        /* Кнопки и тумблеры: нажатие должно чувствоваться, иначе на телефоне
           непонятно, сработало ли касание. */
        button { transition: background-color .32s ease, border-color .32s ease,
                             color .32s ease, transform .22s var(--ease-back),
                             box-shadow .32s ease }
        button:not(:disabled):active { transform: scale(.93) }
        @media (hover: hover) {
          button:not(:disabled):hover { border-color: rgba(160,180,200,0.42) }
          a:hover { border-color: rgba(160,180,200,0.42) }
        }
        @keyframes grow { from { opacity: 0; transform: scale(.86) } to { opacity: 1; transform: none } }

        /* Карта: пинг вокруг активного предупреждения и вокруг EF5 в архиве.
           Радиус анимируется через CSS-геометрию; там, где браузер её не умеет,
           кольцо остаётся статичным — оно и в этом виде читается. */
        @keyframes mapPing { 0% { r: 5; opacity: .7 } 100% { r: 22; opacity: 0 } }
        /* Единственная анимация в дашборде, которая специально тревожит.
           Полсекунды гашения из полутора — заметно, но не мельтешит. */
        @keyframes warnBlink { 0%, 62% { opacity: 1 } 63%, 100% { opacity: .18 } }
        @keyframes alarmEdge {
          0%, 100% { box-shadow: 0 0 0 rgba(255,45,45,0) }
          50%      { box-shadow: 0 0 22px rgba(255,45,45,0.30) }
        }

        .map-ping { animation: mapPing 4s ease-out infinite }
        .map-ping.slow { animation-duration: 6.5s }
        .warn-blink { animation: warnBlink 1.5s steps(1) infinite }
        .detail-extreme { animation: alarmEdge 2.2s ease-in-out infinite }

        .ppi-sweep { animation: ppiSweep 6.5s linear infinite }
        .ppi-sweep.slow { animation-duration: 14s }
        .ping { animation: echoPing 3.6s ease-out infinite }
        .vortex { animation: vortex 5.5s linear infinite }
        .grow { animation: grow .85s var(--ease-back) both; transform-origin: 50% 50% }
        /* Панели въезжают снизу при смене вкладки — движение подсказывает, что
           содержимое сменилось целиком, а не обновилось одно число. */
        /* Панели въезжают по очереди, а не разом: волна слева направо читается
           как «прибор собирается», а одновременный въезд — как рывок экрана.
           Порядковый номер приходит переменной --i прямо из раскладки. */
        .pnl { animation: rise .7s var(--ease-out) both }
        /* Внутри сетки едет сама ячейка, а не панель в ней. Иначе движение
           идёт дважды: панель поднимается внутри ячейки, ячейка стоит, и вместо
           одного въезда получается дёрганье содержимого в неподвижной рамке. */
        .blk { animation: rise .7s var(--ease-out) both;
               animation-delay: calc(var(--i, 0) * 65ms) }
        .blk .pnl, .blk > * { animation: none }
        .modal-card { animation: pop .5s var(--ease-back) both }
        /* Вкладка «Обновление»: точка дышит, пока есть что ставить. */
        .upd-tab {
          position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 95;
          display: flex; align-items: center; padding: 13px 26px; border-radius: 999px; cursor: pointer;
          font-weight: 700; font-size: 13.5px; letter-spacing: 3px; text-transform: uppercase; white-space: nowrap;
          border: 1px solid var(--pnl-line); background: var(--pnl-bg); box-shadow: var(--pnl-shadow);
          -webkit-backdrop-filter: blur(16px) saturate(1.5); backdrop-filter: blur(16px) saturate(1.5);
          animation: updIn .6s var(--ease-back) both;
        }
        .upd-tab:hover { transform: translateX(-50%) scale(1.05) }
        .upd-tab:active { transform: translateX(-50%) scale(.95) }
        .upd-tab .upd-dot { width: 9px; height: 9px; margin-right: 11px; vertical-align: 0 }
        @keyframes updIn { from { opacity: 0; transform: translate(-50%, -30px) scale(.8) } to { opacity: 1; transform: translateX(-50%) } }
        .mo-off .upd-tab { animation: none }
        .upd-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%;
                   margin-right: 8px; vertical-align: 1px; animation: updpulse 1.9s ease-in-out infinite }
        @keyframes updpulse { 0%,100% { opacity: .45; box-shadow: 0 0 0 0 currentColor }
                              50% { opacity: 1; box-shadow: 0 0 9px 1px currentColor } }
        .mo-off .upd-dot { animation: none }
        /* Окно обновления. Стекло даёт .modal-card темы; здесь только содержимое. */
        .upd-ring { width: 46px; height: 46px; border-radius: 15px; flex: none; display: grid; place-items: center;
                    background: linear-gradient(160deg, rgba(255,255,255,0.22), rgba(255,255,255,0.05));
                    box-shadow: inset 0 0.5px 0 rgba(255,255,255,0.55), inset 0 -6px 12px rgba(255,255,255,0.04),
