  <text x="591" y="893" font-size="11" fill="#b3541e">→ «+» и «−» пакета пойдут на TP4056 в задаче 04. Сейчас к ESP32 НЕ подключено.</text>

  <!-- ghost link: batteries -> board, NOT yet connected -->
  <path d="M880 700 L880 536" fill="none" stroke="#c0392b" stroke-width="3" stroke-dasharray="9 7" opacity="0.75"/>
  <circle cx="880" cy="620" r="15" fill="#fff" stroke="#c0392b" stroke-width="3"/>
  <line x1="871" y1="611" x2="889" y2="629" stroke="#c0392b" stroke-width="3"/>
  <line x1="889" y1="611" x2="871" y2="629" stroke="#c0392b" stroke-width="3"/>
  <text x="905" y="600" font-size="12.5" font-weight="700" fill="#c0392b">Проводов сюда пока НЕТ — и это правильно.</text>
  <text x="905" y="620" font-size="11.5" fill="#8a4b3f">Батарею НЕЛЬЗЯ вести напрямую на макетку:</text>
  <text x="905" y="638" font-size="11.5" fill="#8a4b3f">3.95В на VIN → ESP32 уйдёт в brownout.</text>
  <text x="905" y="660" font-size="11.5" fill="#2a7de1">Задача 04: пакет → PTC → TP4056 → Boost#2 (5.14В)</text>
  <text x="905" y="678" font-size="11.5" fill="#2a7de1">→ Schottky → шина 4.7В → SW1 → VIN.</text>

  <text x="591" y="762" font-size="11.5" fill="#888">Сейчас ESP32 питается по USB. Пакет просто собран и лежит рядом.</text>
