  <text x="30" y="38" font-size="24" font-weight="700" fill="#1a1a1a">Метеостанция ветра — текущее состояние на breadboard (задачи 01–03)</text>
  <text x="30" y="62" font-size="15" fill="#666">Вид макетки: реальные дырки, компоненты и провода в конкретные отверстия. ESP32 — точная распиновка DOIT DevKit V1 (30-pin), пины с двух сторон.</text>

