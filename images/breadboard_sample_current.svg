  <!-- ===== Wiring table ===== -->
  <text x="30" y="580" font-size="16" font-weight="700" fill="#1a1a1a">Монтаж (что куда):</text>
  <g font-size="13.5" fill="#333">
    <text x="30" y="606">• GPIO26 → 220Ω → анод зел. LED «OK»;  катод → шина «−»</text>
    <text x="30" y="628">• GPIO27 → 220Ω → анод жёлт. LED «&gt;5 м/с»;  катод → «−»</text>
    <text x="30" y="650">• GPIO14 → 220Ω → анод красн. LED «&gt;15 м/с»;  катод → «−»</text>
    <text x="30" y="672">• GPIO25 → 220Ω → анод зел. LED «WiFi»;  катод → «−»</text>
    <text x="30" y="694">• GPIO33 → 220Ω → анод красн. LED «ошибка»;  катод → «−»</text>
    <text x="30" y="716">• GND ESP32 → шина «−» (общий минус для всех катодов)</text>
    <text x="30" y="738" fill="#b3541e">• Длинная ножка LED = анод (к резистору), короткая = катод (в «−»)</text>
  </g>
  <text x="30" y="768" font-size="12.5" fill="#888">Все использованные пины (VIN, GND, 26, 27, 14, 25, 33) — на ВЕРХНЕМ ряду ESP32 (USB слева).</text>

  <text x="30" y="790" font-size="12.5" fill="#888">Порядок/цвет LED сверь со своей платой — подгоним один-в-один по фото.</text>

