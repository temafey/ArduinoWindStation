<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" font-family="Segoe UI, Arial, sans-serif"><rect width="1240" height="700" fill="#fff"/><text x="30" y="44" font-size="24" font-weight="700" fill="#1a1a1a">Тест F1 — куда воткнуть временную перемычку</text><text x="30" y="70" font-size="14" fill="#666">Крупный план твоей макетки, нижний банк (ряды f–j). Дырки показаны в реальном порядке.</text><rect x="100" y="170" width="600" height="300" rx="10" fill="#f4f0e6" stroke="#d8d2c0" stroke-width="2"/><rect x="248" y="185" width="44" height="270" rx="22" fill="rgba(42,111,209,.10)" stroke="#2a6fd1" stroke-opacity=".55" stroke-dasharray="6 4" stroke-width="2"/><rect x="368" y="185" width="44" height="270" rx="22" fill="rgba(42,111,209,.10)" stroke="#2a6fd1" stroke-opacity=".55" stroke-dasharray="6 4" stroke-width="2"/><text x="150" y="158" font-size="13" font-weight="400" fill="#999" text-anchor="middle">42</text><text x="210" y="158" font-size="13" font-weight="400" fill="#999" text-anchor="middle">43</text><text x="270" y="158" font-size="13" font-weight="400" fill="#999" text-anchor="middle">44</text><text x="330" y="158" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="middle">45</text><text x="390" y="158" font-size="13" font-weight="400" fill="#999" text-anchor="middle">46</text><text x="450" y="158" font-size="13" font-weight="400" fill="#999" text-anchor="middle">47</text><text x="510" y="158" font-size="13" font-weight="400" fill="#999" text-anchor="middle">48</text><text x="570" y="158" font-size="13" font-weight="400" fill="#999" text-anchor="middle">49</text><text x="630" y="158" font-size="13" font-weight="400" fill="#999" text-anchor="middle">50</text><text x="330" y="132" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">эта цифра напечатана</text><text x="330" y="118" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">на макетке ↓</text><text x="122" y="205" font-size="14" fill="#999" text-anchor="middle">f</text><text x="122" y="265" font-size="14" fill="#999" text-anchor="middle">g</text><text x="122" y="325" font-size="14" fill="#999" text-anchor="middle">h</text><text x="122" y="385" font-size="14" fill="#999" text-anchor="middle">i</text><text x="122" y="445" font-size="14" fill="#999" text-anchor="middle">j</text><rect x="142" y="192" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="142" y="252" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="142" y="312" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="142" y="372" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="142" y="432" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="202" y="192" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="202" y="252" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="202" y="312" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="202" y="372" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="202" y="432" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="262" y="192" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="262" y="252" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="262" y="312" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="262" y="372" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="262" y="432" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="322" y="192" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="322" y="252" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="322" y="312" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="322" y="372" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="322" y="432" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="382" y="192" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="382" y="252" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="382" y="312" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="382" y="372" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="382" y="432" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="442" y="192" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="442" y="252" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="442" y="312" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="442" y="372" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="442" y="432" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="502" y="192" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="502" y="252" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="502" y="312" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="502" y="372" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="502" y="432" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="562" y="192" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="562" y="252" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="562" y="312" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="562" y="372" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="562" y="432" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="622" y="192" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="622" y="252" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="622" y="312" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="622" y="372" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="622" y="432" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><line x1="270" y1="260" x2="306" y2="260" stroke="#9a8f6a" stroke-width="4"/><line x1="354" y1="260" x2="390" y2="260" stroke="#9a8f6a" stroke-width="4"/><circle cx="330" cy="260" r="26" fill="#e3c74a" stroke="#a8862c" stroke-width="2.5"/><text x="330" y="265" font-size="14" font-weight="700" fill="#4a3a10" text-anchor="middle">F1</text><text x="330" y="222" font-size="14" font-weight="700" fill="#c47015" text-anchor="middle">F1 — предохранитель</text><circle cx="270" cy="260" r="6" fill="#5a4a20"/><circle cx="390" cy="260" r="6" fill="#5a4a20"/><g opacity="0.45"><line x1="390" y1="200" x2="510" y2="200" stroke="#9a8f6a" stroke-width="3"/><rect x="424" y="191" width="52" height="18" rx="3" fill="#d9c79c" stroke="#9a8f6a"/><text x="450" y="182" font-size="12" fill="#8a6d3b" text-anchor="middle">R5 (делитель)</text></g><path d="M270 320 C 270 350, 390 350, 390 320" fill="none" stroke="#1e9e4a" stroke-width="9" stroke-linecap="round"/><rect x="263" y="313" width="14" height="14" rx="2" fill="#1e9e4a"/><circle cx="270" cy="320" r="15" fill="none" stroke="#1e9e4a" stroke-width="3" stroke-dasharray="4 3"/><rect x="383" y="313" width="14" height="14" rx="2" fill="#1e9e4a"/><circle cx="390" cy="320" r="15" fill="none" stroke="#1e9e4a" stroke-width="3" stroke-dasharray="4 3"/><text x="330" y="602" font-size="17" font-weight="700" fill="#1e9e4a" text-anchor="middle">ВОТ ЭТА ПЕРЕМЫЧКА — воткни сюда</text><text x="330" y="624" font-size="13" fill="#1a6b36" text-anchor="middle">кол.44 (ряд h) → кол.46 (ряд h) · любой dupont «папа-папа»</text><text x="330" y="644" font-size="12" fill="#777" text-anchor="middle">провод просто лежит поверх кол.45 — с ней он не соединён</text><path d="M270 440 C 270 510, 150 530, 100 536" fill="none" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/><circle cx="270" cy="440" r="6" fill="#c0392b"/><text x="104" y="554" font-size="12.5" font-weight="700" fill="#c0392b">уже стоит: «+» батареи</text><path d="M390 440 C 390 510, 640 530, 700 536" fill="none" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/><circle cx="390" cy="440" r="6" fill="#c0392b"/><text x="580" y="554" font-size="12.5" font-weight="700" fill="#c0392b">уже стоит: → B+ TP4056</text><circle cx="390" cy="380" r="11" fill="#c0392b" stroke="#fff" stroke-width="2"/><circle cx="270" cy="380" r="11" fill="#111" stroke="#fff" stroke-width="2"/><text x="110" y="385" font-size="12.5" font-weight="700" fill="#1a1a1a">щупы →</text><rect x="760" y="100" width="450" height="250" rx="12" fill="#eefaf1" stroke="#1e9e4a" stroke-width="2.4"/><text x="782" y="132" font-size="17" font-weight="700" fill="#1e9e4a">Тест 1 — перемычка (без цифр)</text><text x="782" y="160" font-size="13.5" fill="#14532d">1.  Возьми любой dupont-провод «папа-папа»</text><text x="782" y="184" font-size="13.5" fill="#14532d">     (с двух сторон торчат штырьки).</text><text x="782" y="208" font-size="13.5" fill="#14532d">2.  Один конец — в дырку кол.44, ряд h.</text><text x="782" y="232" font-size="13.5" fill="#14532d">3.  Второй конец — в дырку кол.46, ряд h.</text><text x="782" y="256" font-size="13.5" fill="#14532d">4.  Батареи вставлены, адаптер выдернут,</text><text x="782" y="280" font-size="13.5" fill="#14532d">     SW1 включён.</text><text x="782" y="304" font-size="13.5" fill="#14532d">5.  Смотри: станция запустилась или нет.</text><text x="782" y="336" font-size="13.5" font-weight="700" fill="#1e9e4a">Запустилась → виноват F1.  Нет → тест 2.</text><rect x="760" y="368" width="450" height="150" rx="12" fill="#fdf3f2" stroke="#c0392b" stroke-width="2.4"/><text x="782" y="400" font-size="17" font-weight="700" fill="#c0392b">Тест 2 — замер на F1</text><text x="782" y="428" font-size="13.5" fill="#7a2820">Перемычку УБЕРИ. Красный щуп — кол.46,</text><text x="782" y="451" font-size="13.5" fill="#7a2820">чёрный — кол.44 (кружки на картинке).</text><text x="782" y="474" font-size="13.5" fill="#7a2820">Станция под нагрузкой, от батареи.</text><text x="782" y="504" font-size="13.5" font-weight="700" fill="#c0392b">Больше 0.5 В → F1 виноват.</text><rect x="760" y="536" width="450" height="120" rx="12" fill="#fff8e6" stroke="#c47015" stroke-width="2.4"/><text x="782" y="566" font-size="15" font-weight="700" fill="#c47015">⚠  Перемычку потом обязательно убрать</text><text x="782" y="592" font-size="13" fill="#7a4a12">С ней предохранителя в цепи нет —</text><text x="782" y="613" font-size="13" fill="#7a4a12">это только на время теста, у стола.</text><text x="782" y="640" font-size="13" fill="#7a4a12">Колонка = 5 дырок в ряд, все соединены.</text></svg>