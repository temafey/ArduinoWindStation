<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Segoe UI, Arial, sans-serif"><rect width="1300" height="700" fill="#fff"/><text x="30" y="44" font-size="24" font-weight="700" fill="#1a1a1a">Как поставить SMD 1206 на макетку</text><text x="30" y="70" font-size="14" fill="#666">Деталь 3.2 × 1.6 мм. Припаиваем к ней ножки — получается обычная выводная деталь.</text><circle cx="46" cy="122" r="16" fill="#1e9e4a"/><text x="46" y="128" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="74" y="128" font-size="17" font-weight="700" fill="#1a1a1a">Вот она, в масштабе</text><rect x="60" y="168" width="128" height="64" rx="4" fill="#e3c74a" stroke="#a8862c" stroke-width="2"/><rect x="60" y="168" width="22" height="64" rx="3" fill="#b8bcc4" stroke="#7d828a" stroke-width="1.6"/><rect x="166" y="168" width="22" height="64" rx="3" fill="#b8bcc4" stroke="#7d828a" stroke-width="1.6"/><text x="124" y="206" font-size="13" font-weight="700" fill="#4a3a10" text-anchor="middle">2A</text><text x="124" y="156" font-size="12.5" fill="#666" text-anchor="middle">3.2 мм</text><line x1="60" y1="162" x2="188" y2="162" stroke="#999" stroke-width="1.4"/><text x="204" y="206" font-size="12.5" fill="#666">1.6 мм</text><text x="60" y="258" font-size="12" fill="#c47015" font-weight="700">серые торцы — сюда паять</text><text x="60" y="292" font-size="12.5" fill="#666">реальный размер:</text><rect x="176" y="280" width="12" height="6" rx="1" fill="#e3c74a" stroke="#a8862c"/><circle cx="46" cy="344" r="16" fill="#1e9e4a"/><text x="46" y="350" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="74" y="350" font-size="17" font-weight="700" fill="#1a1a1a">Припаять ножки от резисторов</text><line x1="30" y1="400" x2="90" y2="400" stroke="#9a8f6a" stroke-width="4" stroke-linecap="round"/><line x1="218" y1="400" x2="278" y2="400" stroke="#9a8f6a" stroke-width="4" stroke-linecap="round"/><rect x="90" y="376" width="128" height="48" rx="4" fill="#e3c74a" stroke="#a8862c" stroke-width="2"/><rect x="90" y="376" width="22" height="48" rx="3" fill="#b8bcc4" stroke="#7d828a"/><rect x="196" y="376" width="22" height="48" rx="3" fill="#b8bcc4" stroke="#7d828a"/><ellipse cx="101" cy="400" rx="16" ry="15" fill="#c9ccd3" stroke="#8d9199" stroke-width="1.6" opacity="0.92"/><ellipse cx="207" cy="400" rx="16" ry="15" fill="#c9ccd3" stroke="#8d9199" stroke-width="1.6" opacity="0.92"/><text x="154" y="406" font-size="12" font-weight="700" fill="#4a3a10" text-anchor="middle">2A</text><text x="300" y="405" font-size="12.5" font-weight="700" fill="#c47015">← ножки: обрезки от резисторов</text><text x="60" y="452" font-size="13" fill="#333">•  Положи деталь на малярный скотч липкой стороной вверх —</text><text x="60" y="474" font-size="13" fill="#333">    он удержит её, пока паяешь (третьей руки нет).</text><text x="60" y="496" font-size="13" fill="#333">•  Капни флюс-гель на оба торца.</text><text x="60" y="518" font-size="13" fill="#333">•  Залуди сначала торцы детали, потом кончики ножек.</text><text x="60" y="540" font-size="13" fill="#333">•  Приложи ножку к торцу и коснись жалом на 2 сек — схватится.</text><text x="60" y="562" font-size="13" fill="#333">•  Жало C245-KU, температура 300–320 °C (ПОС-63 плавится при 183).</text><text x="60" y="600" font-size="13" fill="#333">•  Надень термоусадку на корпус — чтобы ножки не замкнулись.</text><text x="60" y="622" font-size="13" fill="#333">•  Ножки загни так, чтобы расстояние между ними было <tspan font-weight="700">5 мм</tspan> (2 шага макетки).</text><circle cx="716" cy="122" r="16" fill="#1e9e4a"/><text x="716" y="128" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="744" y="128" font-size="17" font-weight="700" fill="#1a1a1a">Воткнуть в кол.44 и кол.46</text><rect x="700" y="170" width="400" height="190" rx="10" fill="#f4f0e6" stroke="#d8d2c0" stroke-width="2"/><rect x="752" y="192" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="752" y="250" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="752" y="308" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="810" y="192" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="810" y="250" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="810" y="308" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="868" y="192" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="868" y="250" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="868" y="308" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="926" y="192" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="926" y="250" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="926" y="308" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="984" y="192" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="984" y="250" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><rect x="984" y="308" width="16" height="16" rx="3" fill="#fff" stroke="#b9b09a" stroke-width="2"/><text x="760" y="160" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">44</text><text x="818" y="160" font-size="13" font-weight="400" fill="#999" text-anchor="middle">45</text><text x="876" y="160" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">46</text><text x="934" y="160" font-size="13" font-weight="400" fill="#999" text-anchor="middle">47</text><text x="992" y="160" font-size="13" font-weight="400" fill="#999" text-anchor="middle">48</text><line x1="760" y1="258" x2="778" y2="228" stroke="#9a8f6a" stroke-width="3.4" stroke-linecap="round"/><line x1="876" y1="258" x2="858" y2="228" stroke="#9a8f6a" stroke-width="3.4" stroke-linecap="round"/><rect x="778" y="214" width="80" height="28" rx="4" fill="#e3c74a" stroke="#a8862c" stroke-width="2"/><text x="818" y="233" font-size="11" font-weight="700" fill="#4a3a10" text-anchor="middle">F1 · 2A</text><circle cx="760" cy="258" r="6" fill="#5a4a20"/><circle cx="876" cy="258" r="6" fill="#5a4a20"/><text x="818" y="392" font-size="13.5" font-weight="700" fill="#1e9e4a" text-anchor="middle">на место жёлтого, который вынул</text><text x="818" y="414" font-size="12.5" fill="#555" text-anchor="middle">и убери временную перемычку</text><rect x="700" y="440" width="560" height="120" rx="12" fill="#fdf3f2" stroke="#c0392b" stroke-width="2.4"/><text x="724" y="472" font-size="16" font-weight="700" fill="#c0392b">⚠  PolySwitch боится долгого нагрева</text><text x="724" y="498" font-size="13" fill="#7a2820">Это полимер, а не металл. Если греть дольше 3–4 секунд,</text><text x="724" y="518" font-size="13" fill="#7a2820">номинал «уплывёт» и получится второй такой же сюрприз.</text><text x="724" y="544" font-size="13" font-weight="700" fill="#c0392b">Паяй быстро, дай остыть между двумя торцами.</text><rect x="700" y="578" width="560" height="96" rx="12" fill="#eefaf1" stroke="#1e9e4a" stroke-width="2.4"/><text x="724" y="608" font-size="16" font-weight="700" fill="#1e9e4a">✓  После пайки — обязательно померь ещё раз</text><text x="724" y="634" font-size="13" fill="#14532d">Сопротивление (минус щупы) должно остаться <tspan font-weight="700">0.05–0.15 Ω</tspan>.</text><text x="724" y="656" font-size="13" fill="#14532d">Стало сильно больше — перегрел, бери следующий из десяти.</text></svg>